  // ========== INPUT ==========
  // Buttons use pointer events (one code path for touch + mouse). Keyboard
  // activation of a focused button arrives as a click with detail 0.
  function bindHoldable(el, downFn){
    let delayT=null, repT=null;
    const start = (e)=>{
      e.preventDefault();
      if (delayT||repT) return;
      el.classList.add('active-press');
      downFn();
      if (holdRepeat) {
        delayT = setTimeout(()=>{ repT = setInterval(downFn, 55); }, 220);
      }
    };
    const stop = ()=>{
      el.classList.remove('active-press');
      clearTimeout(delayT); delayT=null;
      clearInterval(repT); repT=null;
    };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('click', e => { if (e.detail === 0) downFn(); });
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  function bindTap(el, fn){
    el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
    el.addEventListener('click', e => { if (e.detail === 0) fn(); });
    el.addEventListener('contextmenu', e => e.preventDefault());
  }

  // ========== BRICK DROP (A & B) ==========
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const KEYS = Object.keys(SHAPES);

  function makeBricks(isB){
    const COMBO_MSGS = {
      en: {2:'GOOD!', 3:'GREAT!', 4:'EXCELLENT!', 5:'AMAZING!', 6:'UNREAL!', 7:'GODLIKE!', 8:'LEGENDARY!'},
      el: {2:'ΚΑΛΑ!', 3:'ΤΕΛΕΙΑ!', 4:'ΕΞΑΙΡΕΤΙΚΑ!', 5:'ΑΠΙΣΤΕΥΤΟ!', 6:'ΘΕΙΚΟ!', 7:'ΘΡΥΛΙΚΟ!', 8:'ΘΕΟΣ!'}
    };
    const QUAD_MSGS = {
      en: {1:'4 LINES!', 2:'DOUBLE 4!', 3:'TRIPLE 4!', 4:'QUAD 4!', 5:'PENTA 4!'},
      el: {1:'4 ΓΡΑΜΜΕΣ!', 2:'ΔΙΠΛΟ 4!', 3:'ΤΡΙΠΛΟ 4!', 4:'ΤΕΤΡΑΠΛΟ 4!', 5:'ΠΕΝΤΑΠΛΟ 4!'}
    };
    return {
      grid: null, cur: null, curType: null, curRot: 0, nextType: null,
      score: 0, level: 1, lines: 0, dropInterval: 800, dropAcc: 0,
      gameOver: false,
      combo: 0, quadStreak: 0,
      splash: null, splashTimer: 0,
      bag: [], holdType: null, holdUsed: false, lockT: 0, lockResets: 0,
      // 7-bag randomizer: every piece once per bag, so no long droughts
      takeNext(){
        if (!this.bag.length){
          this.bag = KEYS.slice();
          for (let i = this.bag.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]]; }
        }
        return this.bag.pop();
      },
      init(){
        this.grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
        this.score=0; this.lines=0;
        this.level = levelSelect;
        this.dropInterval = Math.max(120, 900 - (speedSelect-1)*55 - (this.level-1)*35);
        this.dropAcc=0; this.gameOver=false;
        this.combo=0; this.quadStreak=0;
        this.splash=null; this.splashTimer=0;
        this.bag=[]; this.holdType=null; this.holdUsed=false;
        if (isB){
          const garbage = Math.min(12, 2 + levelSelect*2);
          for (let r=ROWS-garbage; r<ROWS; r++){
            for (let c=0;c<COLS;c++) if (Math.random()>0.35) this.grid[r][c]='X';
            this.grid[r][Math.floor(Math.random()*COLS)] = 0;
          }
        }
        this.nextType = this.takeNext();
        this.spawn();
        updateHUD(this.score, this.level, hiscore, t('next'), t('hi'));
        this.drawNext();
        this.drawSide();
      },
      drawSide(){
        setExtra(t('holdLbl'), t('linesLbl') + ' ' + this.lines, true);
        drawPiece(xctx, extraCanvas, this.holdType, this.holdUsed ? 0.4 : 1);
      },
      hold(){
        if (this.holdUsed || this.gameOver) return;
        const prev = this.holdType;
        this.holdType = this.curType;
        this.spawn(prev);
        this.holdUsed = true;   // after spawn(), which clears it when it takes the next piece
        sfx('rotate');
        this.drawSide();
      },
      showSplash(text, ms=1100){
        this.splash = text;
        this.splashTimer = ms;
      },
      spawn(type){
        if (type) this.curType = type;
        else { this.curType = this.nextType; this.nextType = this.takeNext(); this.holdUsed = false; }
        this.curRot = 0;
        this.lockT = 0; this.lockResets = 0; this.dropAcc = 0;
        const base = SHAPES[this.curType];
        this.cur = base.map(([x,y])=>({x:x+3, y:y}));
        if (this.collides(this.cur)) this.die();
        this.drawNext();
      },
      collides(pts){
        for (const p of pts){
          if (p.x<0||p.x>=COLS||p.y>=ROWS) return true;
          if (p.y>=0 && this.grid[p.y][p.x]) return true;
        }
        return false;
      },
      rotate(){
        if (this.curType === 'O') return; // O doesn't rotate
        const newRot = (this.curRot + 1) % 4;
        // rotate shape in its local box: 4x4 for I, 3x3 for the rest
        const n = this.curType === 'I' ? 3 : 2;
        let local = SHAPES[this.curType].map(pt => pt.slice());
        for (let t = 0; t < newRot; t++) local = local.map(([x, y]) => [n - y, x]);
        // previous local shape at current rotation
        let prevLocal = SHAPES[this.curType].map(pt => pt.slice());
        for (let t = 0; t < this.curRot; t++) prevLocal = prevLocal.map(([x, y]) => [n - y, x]);
        // infer pivot = current piece position minus previous local coords
        // use the first block as anchor to avoid drift
        const anchorCur = this.cur[0];
        const anchorPrev = prevLocal[0];
        const baseX = anchorCur.x - anchorPrev[0];
        const baseY = anchorCur.y - anchorPrev[1];
        // wall kicks: try no offset, then left, right, up, 2left, 2right
        const kicks = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,-2],[-1,-1],[1,-1]];
        for (const [kx, ky] of kicks) {
          const cand = local.map(([x, y]) => ({ x: baseX + x + kx, y: baseY + y + ky }));
          if (!this.collides(cand)) {
            this.cur = cand;
            this.curRot = newRot;
            this.groundedMove();
            sfx('rotate');
            return;
          }
        }
      },
      move(dx,dy){
        const moved = this.cur.map(p=>({x:p.x+dx,y:p.y+dy}));
        if (!this.collides(moved)){ this.cur=moved; if (dx) this.groundedMove(); return true; }
        return false;
      },
      grounded(){ return this.collides(this.cur.map(p=>({x:p.x,y:p.y+1}))); },
      // short lock delay: sliding/rotating on the stack resets it (up to 15 times)
      groundedMove(){ if (this.lockResets < 15){ this.lockT = 0; this.lockResets++; } },
      hardDrop(){
        let d=0;
        while(this.move(0,1)) d++;
        this.lock();
        sfx('drop');
      },
      lock(){
        for (const p of this.cur) if (p.y>=0) this.grid[p.y][p.x]=this.curType;
        if (this.cur.some(p=>p.y<0)) { this.die(); return; }
        sfx('lock');
        this.clearLines();
        this.spawn();
      },
      clearLines(){
        let cleared=0;
        for (let r=ROWS-1;r>=0;r--){
          if (this.grid[r].every(c=>c)){
            this.grid.splice(r,1);
            this.grid.unshift(Array(COLS).fill(0));
            cleared++; r++;
          }
        }
        if (cleared){
          // combo: consecutive line-clearing pieces
          this.combo++;
          const pts = [0,40,100,300,1200][cleared]*this.level;
          // combo bonus
          const comboBonus = this.combo >= 2 ? (this.combo - 1) * 50 * this.level : 0;
          this.score += pts + comboBonus;
          this.lines += cleared;
          stats.lines += cleared;
          if (stats.lines >= 100) award('lines100');
          if (cleared === 4){ stats.quads++; award('quad'); }
          if (this.combo > stats.bestCombo) stats.bestCombo = this.combo;
          if (this.combo >= 5) award('combo5');
          const newLev = Math.floor(this.lines/10)+levelSelect;
          if (newLev > this.level){ this.level=newLev; sfx('level'); this.dropInterval=Math.max(80,this.dropInterval-40); }
          else sfx('line');

          // streak of 4-line clears
          if (cleared === 4) {
            this.quadStreak++;
            const tMsgs = QUAD_MSGS[lang] || QUAD_MSGS.en;
            const tKey = Math.min(this.quadStreak, 5);
            this.showSplash(tMsgs[tKey] || tMsgs[5], 1300);
            sfx('level');
          } else {
            this.quadStreak = 0;
            // combo splash from 2nd consecutive clear
            if (this.combo >= 2) {
              const cMsgs = COMBO_MSGS[lang] || COMBO_MSGS.en;
              const cKey = Math.min(this.combo, 8);
              const msg = cMsgs[cKey] || cMsgs[8];
              this.showSplash(this.combo + 'x ' + msg, 1000);
            }
          }

          liveHi(this.score);
          updateHUD(this.score, this.level, hiscore, t('next'), t('hi'));
          this.drawSide();
        } else {
          // locked piece with no lines → reset combos
          this.combo = 0;
          this.quadStreak = 0;
        }
      },
      die(){
        endGame(this);
      },
      update(dt){
        if (this.gameOver) return;
        if (this.grounded()){
          this.lockT += dt;
          if (this.lockT >= Math.max(250, 500 - this.level*15)) this.lock();
        } else {
          this.lockT = 0;
          this.dropAcc += dt;
          if (this.dropAcc >= this.dropInterval){ this.dropAcc=0; this.move(0,1); }
        }
        if (this.gameOver) return;
        if (this.splashTimer > 0) {
          this.splashTimer -= dt;
          if (this.splashTimer <= 0) { this.splash = null; this.splashTimer = 0; }
        }
      },
      draw(){
        clearBoard();
        // locked
        for (let r=0;r<ROWS;r++)
          for (let c=0;c<COLS;c++)
            if (this.grid[r][c]) drawCell(c,r,true);
        // ghost (if enabled)
        if (this.cur){
          if (ghostOn) {
            let off=0;
            while(!this.collides(this.cur.map(p=>({x:p.x,y:p.y+off+1})))) off++;
            this.cur.forEach(p=>drawGhostCell(p.x, p.y+off));
          }
          this.cur.forEach(p=>drawCell(p.x,p.y,true));
        }
        // combo / 4-line splash in center of board
        if (this.splash && this.splashTimer > 0) {
          const alpha = Math.min(1, this.splashTimer / 200);
          bctx.save();
          bctx.globalAlpha = alpha;
          bctx.fillStyle = pixelOn;
          const fontSize = Math.max(12, Math.floor(cellSize * 1.3));
          bctx.font = `bold ${fontSize}px VT323, monospace`;
          bctx.textAlign = 'center';
          bctx.textBaseline = 'middle';
          // dark backing box
          const tw = bctx.measureText(this.splash).width;
          const bx = boardCanvas.width / 2;
          const by = boardCanvas.height / 2;
          bctx.fillStyle = pixelOff;
          bctx.globalAlpha = alpha * 0.85;
          bctx.fillRect(bx - tw/2 - 6, by - fontSize/2 - 4, tw + 12, fontSize + 8);
          bctx.globalAlpha = alpha;
          bctx.fillStyle = pixelOn;
          bctx.fillText(this.splash, bx, by);
          // small combo counter under splash if combo >= 2 and not a 4-line msg
          if (this.combo >= 2 && this.quadStreak === 0) {
            bctx.font = `${Math.floor(fontSize*0.7)}px VT323, monospace`;
            bctx.fillText('COMBO x' + this.combo, bx, by + fontSize * 0.9);
          }
          bctx.restore();
        }
      },
      drawNext(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        drawPiece(nctx, nextCanvas, this.nextType);
      },
      onLeft(){ if(this.move(-1,0)) sfx('move'); },
      onRight(){ if(this.move(1,0)) sfx('move'); },
      onDown(){ if(!this.move(0,1)) this.lock(); else sfx('move'); },
      onUp(){ this.hold(); },
      onA(){ this.rotate(); },
      onB(){ this.hardDrop(); }
    };
  }

  // ========== RACE (C) ==========
  function makeRace(){
    return {
      playerLane: 1, // 0 1 2
      cars: [], score:0, level:1, speed:0, acc:0, spawnAcc:0, gameOver:false,
      lanes: [1, 4, 7], // x positions (cars are 2 wide)
      init(){
        this.playerLane=1; this.cars=[]; this.score=0;
        this.level=levelSelect; this.speed = 0.55 + (speedSelect-1)*0.12 + (levelSelect-1)*0.06;
        this.acc=0; this.spawnAcc=0; this.gameOver=false;
        updateHUD(this.score, this.level, hiscore, t('cars'), t('hi'));
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
      },
      spawnCar(){
        const lane = Math.floor(Math.random()*3);
        // avoid instant collision
        if (this.cars.some(c=>c.lane===lane && c.y < 4)) return;
        this.cars.push({lane, y: -3, w:2, h:3});
      },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt;
        this.spawnAcc += dt;
        const step = this.speed * (dt/16);
        this.cars.forEach(c=> c.y += step);
        // remove offscreen + score
        this.cars = this.cars.filter(c=>{
          if (c.y > ROWS){ this.score += 10; liveHi(this.score); updateHUD(this.score,this.level,hiscore,t('cars'),t('hi')); sfx('score'); return false; }
          return true;
        });
        // spawn
        const spawnRate = Math.max(700, 1800 - this.level*60 - speedSelect*40);
        if (this.spawnAcc > spawnRate){ this.spawnAcc=0; this.spawnCar(); }
        // level up
        if (this.score > 0 && this.score % 200 === 0 && this.score/200 >= this.level){
          this.level++; this.speed += 0.08; sfx('level');
          updateHUD(this.score,this.level,hiscore,t('cars'),t('hi'));
        }
        // collision
        const px = this.lanes[this.playerLane];
        const py = ROWS-4;
        for (const c of this.cars){
          const cx = this.lanes[c.lane];
          if (Math.abs(cx-px)<2 && c.y+c.h > py && c.y < py+3){
            this.die(); break;
          }
        }
      },
      die(){
        endGame(this, 'crash');
      },
      draw(){
        clearBoard();
        // road lines
        bctx.globalAlpha=0.4;
        for (let y=0;y<ROWS;y++){
          if (Math.floor(y/2)%2===0){
            drawCell(3,y,true,0.5);
            drawCell(6,y,true,0.5);
          }
        }
        bctx.globalAlpha=1;
        // player car
        const px = this.lanes[this.playerLane];
        const py = ROWS-4;
        drawRect(px, py, 2, 3, true);
        // enemy cars
        this.cars.forEach(c=>{
          const cx = this.lanes[c.lane];
          drawRect(cx, Math.floor(c.y), 2, 3, true);
        });
      },
      onLeft(){ if(this.playerLane>0){ this.playerLane--; sfx('move'); } },
      onRight(){ if(this.playerLane<2){ this.playerLane++; sfx('move'); } },
      onDown(){}, onUp(){}, onA(){}, onB(){}
    };
  }

  // ========== SNAKE (D) ==========
  function makeSnake(){
    return {
      body: [], dir: {x:1,y:0}, nextDir: {x:1,y:0}, food: null,
      score:0, level:1, moveAcc:0, moveInterval:180, gameOver:false, grow:0,
      init(){
        this.body = [{x:4,y:10},{x:3,y:10},{x:2,y:10}];
        this.dir={x:1,y:0}; this.nextDir={x:1,y:0};
        this.score=0; this.level=levelSelect;
        this.moveInterval = Math.max(90, 280 - (speedSelect-1)*15 - (levelSelect-1)*10);
        this.moveAcc=0; this.gameOver=false; this.grow=0;
        this.placeFood();
        updateHUD(this.score, this.level, hiscore, t('food'), t('hi'));
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
      },
      placeFood(){
        let tries=0;
        do {
          this.food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)};
          tries++;
        } while (this.body.some(b=>b.x===this.food.x&&b.y===this.food.y) && tries<100);
      },
      update(dt){
        if (this.gameOver) return;
        this.moveAcc += dt;
        if (this.moveAcc >= this.moveInterval){
          this.moveAcc=0;
          this.dir = {...this.nextDir};
          const head = this.body[0];
          const nh = {x: head.x+this.dir.x, y: head.y+this.dir.y};
          // wall / self
          if (nh.x<0||nh.x>=COLS||nh.y<0||nh.y>=ROWS || this.body.some(b=>b.x===nh.x&&b.y===nh.y)){
            this.die(); return;
          }
          this.body.unshift(nh);
          if (nh.x===this.food.x && nh.y===this.food.y){
            this.score += 10;
            sfx('eat');
            liveHi(this.score);
            if (this.score % 50 === 0){ this.level++; this.moveInterval=Math.max(80,this.moveInterval-10); sfx('level'); }
            updateHUD(this.score, this.level, hiscore, t('food'), t('hi'));
            this.placeFood();
          } else if (this.grow>0){ this.grow--; }
          else this.body.pop();
        }
      },
      die(){
        endGame(this);
      },
      draw(){
        clearBoard();
        this.body.forEach((b,i)=> drawCell(b.x, b.y, true, i===0?1:0.85));
        if (this.food) drawCell(this.food.x, this.food.y, true);
      },
      setDir(dx,dy){
        // prevent reverse
        if (this.dir.x + dx === 0 && this.dir.y + dy === 0) return;
        this.nextDir = {x:dx, y:dy};
      },
      onLeft(){ this.setDir(-1,0); sfx('move'); },
      onRight(){ this.setDir(1,0); sfx('move'); },
      onUp(){ this.setDir(0,-1); sfx('move'); },
      onDown(){ this.setDir(0,1); sfx('move'); },
      onA(){}, onB(){}
    };
  }

  // ========== SHOOT (E) ==========
  function makeShoot(){
    return {
      playerX: 4, bullets: [], enemies: [], score:0, level:1,
      acc:0, spawnAcc:0, gameOver:false, lives:3,
      init(){
        this.playerX=4; this.bullets=[]; this.enemies=[];
        this.score=0; this.level=levelSelect; this.lives=3;
        this.acc=0; this.spawnAcc=0; this.gameOver=false;
        this.spawnWave();
        updateHUD(this.score, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn;
        nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      spawnWave(){
        const rows = Math.min(4, 1+Math.floor(this.level/2));
        for (let r=0;r<rows;r++){
          for (let c=0;c<8;c++){
            if (Math.random()>0.3) this.enemies.push({x:c+1, y:r+1, hp:1});
          }
        }
      },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt; this.spawnAcc += dt;
        // move bullets
        this.bullets.forEach(b=> b.y -= 0.18*(dt/16)*(1+speedSelect*0.06));
        this.bullets = this.bullets.filter(b=>b.y > -1);
        // enemy descend slowly
        if (this.spawnAcc > Math.max(1200, 3200 - this.level*120 - speedSelect*80)){
          this.spawnAcc=0;
          this.enemies.forEach(e=> e.y += 1);
          // check bottom
          if (this.enemies.some(e=>e.y >= ROWS-2)){ this.hit(); }
        }
        // collisions bullet-enemy
        for (let i=this.bullets.length-1;i>=0;i--){
          const b=this.bullets[i];
          for (let j=this.enemies.length-1;j>=0;j--){
            const e=this.enemies[j];
            if (Math.abs(b.x-e.x)<1 && Math.abs(b.y-e.y)<1){
              this.enemies.splice(j,1);
              this.bullets.splice(i,1);
              this.score += 20;
              sfx('hit');
              liveHi(this.score);
              updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
              break;
            }
          }
        }
        if (this.enemies.length===0){
          this.level++; sfx('level');
          updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
          this.spawnWave();
        }
      },
      hit(){
        this.lives--;
        this.drawSide();
        sfx('die');
        this.enemies = this.enemies.filter(e=>e.y < ROWS-3);
        if (this.lives<=0) endGame(this);
      },
      shoot(){
        if (this.bullets.length < 3){
          this.bullets.push({x:this.playerX, y:ROWS-3});
          sfx('shoot');
        }
      },
      draw(){
        clearBoard();
        // player
        drawRect(this.playerX, ROWS-2, 1, 2, true);
        // bullets
        this.bullets.forEach(b=> drawCell(Math.floor(b.x), Math.floor(b.y), true));
        // enemies
        this.enemies.forEach(e=> drawCell(e.x, Math.floor(e.y), true));
      },
      onLeft(){ if(this.playerX>0){ this.playerX--; sfx('move'); } },
      onRight(){ if(this.playerX<COLS-1){ this.playerX++; sfx('move'); } },
      onDown(){}, onUp(){ this.shoot(); },
      onA(){ this.shoot(); }, onB(){ this.shoot(); }
    };
  }

  // ========== TANK (F) ==========
  function makeTank(){
    return {
      px:4, py:16, pDir:0, // 0u 1r 2d 3l
      bullets: [], enemies: [], score:0, level:1, lives:3,
      acc:0, eAcc:0, gameOver:false, spawnCD:0,
      dirs: [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}],
      init(){
        this.px=4; this.py=16; this.pDir=0;
        this.bullets=[]; this.enemies=[]; this.score=0;
        this.level=levelSelect; this.lives=3;
        this.acc=0; this.eAcc=0; this.gameOver=false; this.spawnCD=0;
        this.spawnEnemy();
        updateHUD(this.score, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn; nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      spawnEnemy(){
        if (this.enemies.length >= 3+Math.floor(this.level/2)) return;
        const side = Math.floor(Math.random()*3);
        let x,y;
        if (side===0){ x=Math.floor(Math.random()*COLS); y=0; }
        else if (side===1){ x=0; y=Math.floor(Math.random()*8); }
        else { x=COLS-1; y=Math.floor(Math.random()*8); }
        this.enemies.push({x, y, dir:Math.floor(Math.random()*4), moveCD:0, shootCD:40+Math.random()*60});
      },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt; this.eAcc += dt; this.spawnCD += dt;
        // player bullets
        this.bullets.forEach(b=>{
          b.x += this.dirs[b.dir].x * 0.22*(dt/16);
          b.y += this.dirs[b.dir].y * 0.22*(dt/16);
        });
        this.bullets = this.bullets.filter(b=>b.x>=-1&&b.x<COLS+1&&b.y>=-1&&b.y<ROWS+1);
        // enemies AI
        if (this.eAcc > Math.max(160, 380 - this.level*12 - speedSelect*15)){
          this.eAcc=0;
          this.enemies.forEach(e=>{
            e.moveCD--; e.shootCD--;
            if (e.moveCD<=0){
              if (Math.random()<0.3) e.dir = Math.floor(Math.random()*4);
              const nx=e.x+this.dirs[e.dir].x, ny=e.y+this.dirs[e.dir].y;
              if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS-3) { e.x=nx; e.y=ny; }
              else e.dir = Math.floor(Math.random()*4);
              e.moveCD=3+Math.floor(Math.random()*4);
            }
            if (e.shootCD<=0){
              this.bullets.push({x:e.x, y:e.y, dir:e.dir, enemy:true});
              e.shootCD=50+Math.random()*80;
            }
          });
        }
        // spawn more
        if (this.spawnCD > Math.max(1500, 4000-this.level*200)){ this.spawnCD=0; this.spawnEnemy(); }
        // collisions
        for (let i=this.bullets.length-1;i>=0;i--){
          const b=this.bullets[i];
          if (!b.enemy){
            for (let j=this.enemies.length-1;j>=0;j--){
              const e=this.enemies[j];
              if (Math.abs(b.x-e.x)<0.8 && Math.abs(b.y-e.y)<0.8){
                this.enemies.splice(j,1); this.bullets.splice(i,1);
                this.score+=50; sfx('hit');
                liveHi(this.score);
                if (this.score%200===0){ this.level++; sfx('level'); }
                updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
                break;
              }
            }
          } else {
            if (Math.abs(b.x-this.px)<0.8 && Math.abs(b.y-this.py)<0.8){
              this.bullets.splice(i,1);
              this.lives--; this.drawSide(); sfx('die');
              if (this.lives<=0) endGame(this);
            }
          }
        }
      },
      shoot(){
        if (this.bullets.filter(b=>!b.enemy).length < 2){
          this.bullets.push({x:this.px, y:this.py, dir:this.pDir, enemy:false});
          sfx('shoot');
        }
      },
      moveP(dx,dy){
        const nx=this.px+dx, ny=this.py+dy;
        if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){ this.px=nx; this.py=ny; sfx('move'); }
      },
      draw(){
        clearBoard();
        // base protection line
        for (let c=0;c<COLS;c++) drawCell(c, ROWS-1, true, 0.35);
        // player
        drawCell(this.px, this.py, true);
        // simple dir indicator
        const d=this.dirs[this.pDir];
        drawCell(this.px+d.x, this.py+d.y, true, 0.5);
        // enemies
        this.enemies.forEach(e=> drawCell(Math.floor(e.x), Math.floor(e.y), true));
        // bullets
        this.bullets.forEach(b=> drawCell(Math.floor(b.x), Math.floor(b.y), true));
      },
      onLeft(){ this.pDir=3; this.moveP(-1,0); },
      onRight(){ this.pDir=1; this.moveP(1,0); },
      onUp(){ this.pDir=0; this.moveP(0,-1); },
      onDown(){ this.pDir=2; this.moveP(0,1); },
      onA(){ this.shoot(); }, onB(){ this.shoot(); }
    };
  }

  // ========== BRICK BREAKER (G) ==========
  function makeBreak(){
    return {
      paddleX: 3, ballX:5, ballY:12, ballDX:0.12, ballDY:-0.12,
      bricks: [], score:0, level:1, lives:3, acc:0, gameOver:false, started:false,
      init(){
        this.paddleX=3; this.ballX=5; this.ballY=14;
        this.ballDX=0.07 + speedSelect*0.012; this.ballDY=-0.07 - speedSelect*0.012;
        this.score=0; this.level=levelSelect; this.lives=3;
        this.acc=0; this.gameOver=false; this.started=false;
        this.buildBricks();
        updateHUD(this.score, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn; nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      buildBricks(){
        this.bricks=[];
        const rows = Math.min(6, 2+this.level);
        for (let r=0;r<rows;r++)
          for (let c=0;c<COLS;c++)
            if (Math.random()>0.15) this.bricks.push({x:c, y:r+1, hp:1});
      },
      update(dt){
        if (this.gameOver || !this.started) return;
        const sp = 0.9 + this.level*0.08;
        this.ballX += this.ballDX * sp * (dt/16);
        this.ballY += this.ballDY * sp * (dt/16);
        // walls
        if (this.ballX < 0){ this.ballX=0; this.ballDX*=-1; sfx('hit'); }
        if (this.ballX > COLS-1){ this.ballX=COLS-1; this.ballDX*=-1; sfx('hit'); }
        if (this.ballY < 0){ this.ballY=0; this.ballDY*=-1; sfx('hit'); }
        // paddle
        if (this.ballY >= ROWS-3 && this.ballY < ROWS-1 &&
            this.ballX >= this.paddleX-0.5 && this.ballX <= this.paddleX+3.5){
          this.ballDY = -Math.abs(this.ballDY);
          const hitPos = (this.ballX - this.paddleX) / 3;
          this.ballDX = (hitPos - 0.5) * 0.22;
          sfx('hit');
        }
        // bottom
        if (this.ballY > ROWS){
          this.lives--; this.drawSide(); sfx('die');
          this.started=false;
          this.ballX = this.paddleX+1; this.ballY=14;
          this.ballDY=-Math.abs(this.ballDY);
          if (this.lives<=0) endGame(this);
        }
        // bricks
        for (let i=this.bricks.length-1;i>=0;i--){
          const br=this.bricks[i];
          if (Math.abs(this.ballX-br.x)<0.8 && Math.abs(this.ballY-br.y)<0.8){
            this.bricks.splice(i,1);
            this.ballDY *= -1;
            this.score += 15;
            sfx('hit');
            liveHi(this.score);
            updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
            break;
          }
        }
        if (this.bricks.length===0){
          this.level++; sfx('level');
          this.buildBricks();
          this.started=false;
          this.ballX=this.paddleX+1; this.ballY=14;
          updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
        }
      },
      draw(){
        clearBoard();
        // bricks
        this.bricks.forEach(br=> drawCell(br.x, br.y, true));
        // paddle
        drawRect(this.paddleX, ROWS-2, 3, 1, true);
        // ball
        drawCell(Math.floor(this.ballX), Math.floor(this.ballY), true);
      },
      onLeft(){ if(this.paddleX>0){ this.paddleX--; if(!this.started) this.ballX=this.paddleX+1; sfx('move'); } },
      onRight(){ if(this.paddleX<COLS-3){ this.paddleX++; if(!this.started) this.ballX=this.paddleX+1; sfx('move'); } },
      onDown(){}, onUp(){ if(!this.started){ this.started=true; sfx('start'); } },
      onA(){ if(!this.started){ this.started=true; sfx('start'); } },
      onB(){ if(!this.started){ this.started=true; sfx('start'); } }
    };
  }

  // ========== FROG (H) ==========
  function makeFrog(){
    return {
      fx:4, fy:18, score:0, level:1, lives:3, acc:0, gameOver:false,
      cars: [], logs: [], home: [false,false,false,false,false],
      init(){
        this.fx=4; this.fy=18; this.score=0; this.level=levelSelect;
        this.lives=3; this.acc=0; this.gameOver=false;
        this.home=[false,false,false,false,false];
        this.buildTraffic();
        updateHUD(this.score, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn; nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      buildTraffic(){
        this.cars=[]; this.logs=[];
        // cars rows 12-15
        for (let r=0;r<4;r++){
          const y = 15-r;
          const dir = r%2===0 ? 1 : -1;
          const sp = (0.035 + this.level*0.006 + speedSelect*0.005) * dir;
          for (let i=0;i<3;i++){
            this.cars.push({x: Math.random()*COLS, y, w:2, sp, dir});
          }
        }
        // logs rows 3-7
        for (let r=0;r<5;r++){
          const y = 7-r;
          const dir = r%2===0 ? -1 : 1;
          const sp = (0.03 + this.level*0.005 + speedSelect*0.004) * dir;
          for (let i=0;i<2;i++){
            this.logs.push({x: Math.random()*COLS, y, w:3, sp, dir});
          }
        }
      },
      update(dt){
        if (this.gameOver) return;
        const k = dt/16;
        this.cars.forEach(c=>{
          c.x += c.sp * k;
          if (c.dir>0 && c.x > COLS) c.x = -c.w;
          if (c.dir<0 && c.x < -c.w) c.x = COLS;
        });
        this.logs.forEach(l=>{
          l.x += l.sp * k;
          if (l.dir>0 && l.x > COLS) l.x = -l.w;
          if (l.dir<0 && l.x < -l.w) l.x = COLS;
        });
        // frog on log?
        if (this.fy >= 3 && this.fy <= 7){
          let onLog=false;
          for (const l of this.logs){
            if (this.fy===l.y && this.fx >= l.x-0.3 && this.fx <= l.x+l.w-0.3){
              this.fx += l.sp * k;
              onLog=true; break;
            }
          }
          if (!onLog || this.fx<0 || this.fx>=COLS) this.die();
        }
        // car collision
        if (this.fy >= 12 && this.fy <= 15){
          for (const c of this.cars){
            if (this.fy===c.y && this.fx >= c.x-0.3 && this.fx <= c.x+c.w-0.3){ this.die(); break; }
          }
        }
        // home
        if (this.fy <= 1){
          const slot = Math.floor(this.fx / 2);
          if (slot>=0 && slot<5 && !this.home[slot] && this.fx%2 < 1.5){
            this.home[slot]=true;
            this.score += 100;
            sfx('score');
            liveHi(this.score);
            updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
            this.fx=4; this.fy=18;
            if (this.home.every(h=>h)){
              this.level++; sfx('level');
              this.home=[false,false,false,false,false];
              this.buildTraffic();
              updateHUD(this.score,this.level,hiscore,t('live'),t('hi'));
            }
          } else this.die();
        }
      },
      die(){
        this.lives--; this.drawSide(); sfx('die');
        this.fx=4; this.fy=18;
        if (this.lives<=0) endGame(this);
      },
      move(dx,dy){
        const nx=this.fx+dx, ny=this.fy+dy;
        if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){ this.fx=nx; this.fy=ny; sfx('move');
          if (dy<0) { this.score+=5; updateHUD(this.score,this.level,hiscore,t('live'),t('hi')); }
        }
      },
      draw(){
        clearBoard();
        // water
        for (let y=3;y<=7;y++) for (let x=0;x<COLS;x++) drawCell(x,y,true,0.15);
        // road
        for (let y=12;y<=15;y++) for (let x=0;x<COLS;x++) drawCell(x,y,true,0.12);
        // homes
        for (let i=0;i<5;i++){
          if (this.home[i]) drawCell(i*2, 0, true);
          else drawCell(i*2, 0, true, 0.3);
        }
        // logs
        this.logs.forEach(l=> drawRect(Math.floor(l.x), l.y, l.w, 1, true));
        // cars
        this.cars.forEach(c=> drawRect(Math.floor(c.x), c.y, c.w, 1, true));
        // frog – flashing for visibility
        const flash = (Math.floor(performance.now() / 180) % 2) === 0;
        drawCell(Math.floor(this.fx), this.fy, true, flash ? 1 : 0.35);
      },
      onLeft(){ this.move(-1,0); },
      onRight(){ this.move(1,0); },
      onUp(){ this.move(0,-1); },
      onDown(){ this.move(0,1); },
      onA(){ this.move(0,-1); }, onB(){ this.move(0,-1); }
    };
  }

  // ========== STACK (I) ==========
  // A sliding row: stop it on top of the one below. Overhang is cut off.
  function makeStack(){
    return {
      rows: [], x: 0, w: 4, dir: 1, acc: 0, score: 0, level: 1, gameOver: false, flash: 0, cut: [],
      init(){
        this.level = levelSelect; this.score = 0; this.gameOver = false;
        this.newRound();
        updateHUD(this.score, this.level, hiscore, t('mode'), t('hi'));
        drawIcon(nctx, nextCanvas, MODES_BY_ID.I.icon);
      },
      newRound(){
        this.rows = []; this.w = 4; this.x = 0; this.dir = 1; this.acc = 0; this.cut = [];
      },
      interval(){ return Math.max(40, 170 - speedSelect*10 - this.level*8 - this.rows.length*4); },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt;
        if (this.flash > 0) this.flash -= dt;
        while (this.acc >= this.interval()){
          this.acc -= this.interval();
          if (this.x + this.dir < 0 || this.x + this.w + this.dir > COLS) this.dir *= -1;
          this.x += this.dir;
        }
      },
      stop(){
        if (this.gameOver) return;
        const below = this.rows[this.rows.length - 1];
        let x = this.x, w = this.w;
        this.cut = [];
        if (below){
          const l = Math.max(x, below.x), r = Math.min(x + w, below.x + below.w);
          for (let c = x; c < x + w; c++) if (c < l || c >= r) this.cut.push(c);
          x = l; w = r - l;
        }
        if (w <= 0){ this.w = 0; endGame(this); return; }
        this.rows.push({x, w});
        this.w = w; this.flash = 180;
        this.score += 10 * w * this.level;
        sfx(this.cut.length ? 'hit' : 'lock');
        if (this.rows.length >= ROWS){
          award('stackTop');
          this.score += 500 * this.level;
          this.level++; sfx('level');
          this.newRound();
        } else {
          this.x = Math.random() < 0.5 ? 0 : COLS - this.w;
          this.dir = this.x === 0 ? 1 : -1;
        }
        updateHUD(this.score, this.level, liveHi(this.score), t('mode'), t('hi'));
      },
      draw(){
        clearBoard();
        this.rows.forEach((r, i) => drawRect(r.x, ROWS - 1 - i, r.w, 1, true));
        if (this.flash > 0) this.cut.forEach(c => drawCell(c, ROWS - this.rows.length, true, 0.4));
        if (!this.gameOver) drawRect(this.x, ROWS - 1 - this.rows.length, this.w, 1, true);
      },
      onLeft(){}, onRight(){},
      onUp(){ this.stop(); }, onDown(){ this.stop(); },
      onA(){ this.stop(); }, onB(){ this.stop(); }
    };
  }

  // ========== RUNNER (J) ==========
  // One-button runner: jump over blocks, duck (down) under birds.
  function makeRunner(){
    const GROUND = ROWS - 2;   // row the runner's feet stand on
    const G_ACC = 0.00009;     // gravity, cells/ms²
    const JUMP_V = Math.sqrt(2 * G_ACC * 3.6);
    return {
      h: 0, vy: 0, duck: 0, obs: [], dist: 0, speed: 0, spawnIn: 0, score: 0, level: 1, gameOver: false, scroll: 0,
      init(){
        this.h = 0; this.vy = 0; this.duck = 0; this.obs = []; this.dist = 0; this.scroll = 0;
        this.level = levelSelect; this.score = 0; this.gameOver = false;
        this.speed = 0.0065 + speedSelect*0.0006 + this.level*0.0005;
        this.spawnIn = 900;
        updateHUD(0, this.level, hiscore, t('mode'), t('hi'));
        drawIcon(nctx, nextCanvas, MODES_BY_ID.J.icon);
      },
      jump(){
        if (this.h === 0 && !this.gameOver){ this.vy = JUMP_V; this.duck = 0; sfx('jump'); }
      },
      update(dt){
        if (this.gameOver) return;
        // physics
        if (this.h > 0 || this.vy > 0){
          this.h += this.vy * dt; this.vy -= G_ACC * dt;
          if (this.h <= 0){ this.h = 0; this.vy = 0; }
        }
        if (this.duck > 0) this.duck -= dt;
        // world
        const dx = this.speed * dt;
        this.scroll += dx;
        this.obs.forEach(o => o.x -= dx);
        this.obs = this.obs.filter(o => o.x + o.w > -1);
        this.spawnIn -= dt;
        if (this.spawnIn <= 0){
          const bird = this.level >= 2 && Math.random() < 0.3;
          if (bird) this.obs.push({x: COLS, w: 2, y: 1.2, hgt: 1, bird: true});
          else { const tall = Math.random() < 0.4; this.obs.push({x: COLS, w: Math.random() < 0.3 ? 2 : 1, y: 0, hgt: tall ? 2 : 1}); }
          this.spawnIn = Math.max(450, 1500 - this.level*80) + Math.random()*900;
        }
        // score / level
        this.dist += dx;
        const s = Math.floor(this.dist * 2);
        if (s !== this.score){
          this.score = s;
          if (this.score > 0 && this.score % 150 === 0){ this.level++; this.speed += 0.0008; sfx('level'); }
          updateHUD(this.score, this.level, liveHi(this.score), t('mode'), t('hi'));
        }
        // collision: runner occupies column 1, heights [h, h+size)
        const size = this.duck > 0 && this.h === 0 ? 1 : 2;
        for (const o of this.obs){
          if (o.x < 1.8 && o.x + o.w > 1.2 && this.h < o.y + o.hgt - 0.15 && this.h + size > o.y + 0.15){
            endGame(this, 'crash'); return;
          }
        }
      },
      draw(){
        clearBoard();
        // scrolling ground
        const off = Math.floor(this.scroll) % 3;
        for (let c = 0; c < COLS; c++) drawCell(c, GROUND + 1, true, (c + off) % 3 === 0 ? 0.35 : 0.7);
        // runner
        const feet = GROUND - Math.round(this.h);
        if (this.duck > 0 && this.h === 0){ drawCell(1, feet); drawCell(2, feet, true, 0.6); }
        else { drawCell(1, feet); drawCell(1, feet - 1); }
        // obstacles
        this.obs.forEach(o => {
          const x = Math.round(o.x);
          for (let i = 0; i < o.w; i++) for (let j = 0; j < o.hgt; j++)
            drawCell(x + i, GROUND - Math.round(o.y) - j, true, o.bird && i === 1 ? 0.6 : 1);
        });
      },
      onLeft(){}, onRight(){},
      onUp(){ this.jump(); }, onA(){ this.jump(); }, onB(){ this.jump(); },
      onDown(){ if (this.h === 0) this.duck = 450; else this.vy = Math.min(this.vy, -JUMP_V); }
    };
  }

  // ========== FILL (K) ==========
  // Rows creep down from the top; shoot single blocks up to complete them.
  function makeFill(){
    return {
      grid: null, px: 4, acc: 0, score: 0, level: 1, lines: 0, gameOver: false, shots: [],
      init(){
        this.grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        this.level = levelSelect; this.score = 0; this.lines = 0; this.gameOver = false;
        this.px = 4; this.acc = 0; this.shots = [];
        for (let i = 0; i < 3 + Math.min(5, this.level); i++) this.pushRow();
        updateHUD(0, this.level, hiscore, t('mode'), t('hi'));
        drawIcon(nctx, nextCanvas, MODES_BY_ID.K.icon);
      },
      newRow(){
        const row = Array(COLS).fill(1);
        const gaps = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < gaps; i++) row[Math.floor(Math.random()*COLS)] = 0;
        return row;
      },
      pushRow(){
        if (this.grid[ROWS-1].some(Boolean)) return;
        this.grid.pop();
        this.grid.unshift(this.newRow());
      },
      interval(){ return Math.max(1400, 6500 - this.level*450 - speedSelect*250); },
      update(dt){
        if (this.gameOver) return;
        this.shots.forEach(s => s.life -= dt);
        this.shots = this.shots.filter(s => s.life > 0);
        this.acc += dt;
        if (this.acc >= this.interval()){
          this.acc = 0;
          this.pushRow();
          if (this.dangerHit()) endGame(this);
        }
      },
      dangerHit(){ return this.grid[ROWS-3].some(Boolean); },
      shoot(){
        if (this.gameOver) return;
        const x = this.px;
        if (this.grid[ROWS-3][x]) return;
        let r = ROWS - 3;
        while (r > 0 && !this.grid[r-1][x]) r--;
        this.grid[r][x] = 1;
        this.shots.push({x, from: r, life: 90});
        this.score += 2;
        sfx('shoot');
        if (this.grid[r].every(Boolean)){
          // full row: remove it and let the rows below slide back up
          this.grid.splice(r, 1);
          this.grid.push(Array(COLS).fill(0));
          this.lines++;
          this.score += 100 * this.level;
          sfx('line');
          if (this.lines % 8 === 0){ this.level++; sfx('level'); }
        }
        if (this.dangerHit()) { endGame(this); return; }
        updateHUD(this.score, this.level, liveHi(this.score), t('mode'), t('hi'));
      },
      draw(){
        clearBoard();
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.grid[r][c]) drawCell(c, r);
        // danger line
        for (let c = 0; c < COLS; c++) if (!this.grid[ROWS-3][c]) drawCell(c, ROWS-3, true, 0.1);
        this.shots.forEach(s => { for (let y = s.from + 1; y < ROWS - 2; y++) drawCell(s.x, y, true, 0.35); });
        drawCell(this.px, ROWS-2);
        drawRect(this.px-1, ROWS-1, 3, 1);
      },
      onLeft(){ if (this.px > 0){ this.px--; sfx('move'); } },
      onRight(){ if (this.px < COLS-1){ this.px++; sfx('move'); } },
      onUp(){ this.shoot(); }, onDown(){},
      onA(){ this.shoot(); }, onB(){ this.shoot(); }
    };
  }

  // ========== PONG (L) ==========
  function makePong(){
    const PW = 3;
    return {
      px: 3, cx: 3, bx: 4.5, by: 10, vx: 0, vy: 0, serveIn: 0, cpuAcc: 0,
      score: 0, level: 1, lives: 3, rally: 0, gameOver: false,
      init(){
        this.level = levelSelect; this.score = 0; this.lives = 3; this.gameOver = false;
        this.px = 3; this.cx = 3;
        this.serve(1);
        updateHUD(0, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){ drawHearts(this.lives); },
      baseSpeed(){ return 0.0085 + speedSelect*0.0008 + this.level*0.0006; },
      serve(dirY){
        this.bx = 4.5; this.by = 10; this.rally = 0;
        const s = this.baseSpeed();
        this.vx = (Math.random() < 0.5 ? -1 : 1) * s * 0.5;
        this.vy = dirY * s;
        this.serveIn = 700;
      },
      update(dt){
        if (this.gameOver) return;
        // CPU paddle tracks the ball (imperfectly)
        this.cpuAcc += dt;
        const cpuStep = Math.max(70, 190 - this.level*14);
        if (this.cpuAcc >= cpuStep){
          this.cpuAcc = 0;
          const target = (this.vy < 0 ? this.bx : 4.5) - PW/2 + (Math.random() - 0.5) * 1.5;
          if (this.cx < target - 0.5 && this.cx < COLS - PW) this.cx++;
          else if (this.cx > target + 0.5 && this.cx > 0) this.cx--;
        }
        if (this.serveIn > 0){ this.serveIn -= dt; return; }
        this.bx += this.vx * dt; this.by += this.vy * dt;
        if (this.bx < 0){ this.bx = 0; this.vx = Math.abs(this.vx); sfx('move'); }
        if (this.bx > COLS - 1){ this.bx = COLS - 1; this.vx = -Math.abs(this.vx); sfx('move'); }
        // player paddle (row ROWS-1), CPU paddle (row 0)
        if (this.vy > 0 && this.by >= ROWS - 2 && this.by < ROWS - 1 + 0.5){
          if (this.bx + 0.5 >= this.px && this.bx + 0.5 <= this.px + PW){ this.bounce(this.px, -1); this.score += 5; this.hud(); }
        }
        if (this.vy < 0 && this.by <= 1 && this.by > -0.5){
          if (this.bx + 0.5 >= this.cx && this.bx + 0.5 <= this.cx + PW) this.bounce(this.cx, 1);
        }
        if (this.by > ROWS){
          this.lives--; this.drawSide(); sfx('die');
          if (this.lives <= 0){ endGame(this); return; }
          this.serve(1);
        } else if (this.by < -1){
          this.score += 100 * this.level; sfx('score');
          if (this.score >= this.level * 600){ this.level++; sfx('level'); }
          this.hud();
          this.serve(-1);
        }
      },
      bounce(padX, dirY){
        const hit = (this.bx + 0.5 - padX) / PW - 0.5;     // -0.5 .. 0.5
        this.rally++;
        const s = this.baseSpeed() * (1 + Math.min(0.6, this.rally * 0.04));
        this.vx = hit * s * 1.6;
        this.vy = dirY * s;
        this.by = dirY < 0 ? ROWS - 2 : 1;
        sfx('hit');
      },
      hud(){ updateHUD(this.score, this.level, liveHi(this.score), t('live'), t('hi')); },
      draw(){
        clearBoard();
        for (let c = 0; c < COLS; c += 2) drawCell(c, ROWS/2, true, 0.25);
        drawRect(this.cx, 0, PW, 1);
        drawRect(this.px, ROWS - 1, PW, 1);
        if (this.serveIn <= 0 || Math.floor(this.serveIn / 120) % 2) drawCell(Math.round(this.bx), Math.round(this.by));
      },
      onLeft(){ if (this.px > 0){ this.px--; } },
      onRight(){ if (this.px < COLS - PW){ this.px++; } },
      onUp(){}, onDown(){}, onA(){}, onB(){}
    };
  }

  // ========== INVADERS (M) ==========
  function makeInvaders(){
    return {
      px: 4, shots: [], bombs: [], aliens: [], gx: 0, gy: 0, gdir: 1, acc: 0, bombAcc: 0,
      score: 0, level: 1, lives: 3, gameOver: false, shields: [],
      init(){
        this.level = levelSelect; this.score = 0; this.lives = 3; this.gameOver = false;
        this.px = 4; this.shots = []; this.bombs = [];
        this.wave();
        updateHUD(0, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){ drawHearts(this.lives); },
      wave(){
        this.aliens = [];
        const rows = Math.min(4, 2 + Math.floor(this.level / 3));
        for (let r = 0; r < rows; r++) for (let c = 0; c < 6; c++) this.aliens.push({x: c, y: r});
        this.gx = 0; this.gy = 1 + Math.min(4, Math.floor((this.level - 1) / 2)); this.gdir = 1; this.acc = 0;
        this.shields = [];
        [1, 4, 7].forEach(x => { this.shields.push({x, y: ROWS - 5}); this.shields.push({x: x + 1, y: ROWS - 5}); });
      },
      interval(){
        const total = this.aliens.length || 1;
        return Math.max(90, 750 - this.level*45 - speedSelect*35 - (24 - total) * 18);
      },
      update(dt){
        if (this.gameOver) return;
        // march
        this.acc += dt;
        if (this.acc >= this.interval()){
          this.acc = 0;
          const minX = Math.min(...this.aliens.map(a => a.x)) + this.gx;
          const maxX = Math.max(...this.aliens.map(a => a.x)) + this.gx;
          if ((this.gdir > 0 && maxX >= COLS - 1) || (this.gdir < 0 && minX <= 0)){ this.gy++; this.gdir *= -1; }
          else this.gx += this.gdir;
          sfx('move');
          const lowest = Math.max(...this.aliens.map(a => a.y)) + this.gy;
          if (lowest >= ROWS - 2){ endGame(this); return; }
        }
        // alien bombs
        this.bombAcc += dt;
        if (this.bombAcc > Math.max(450, 1600 - this.level*110)){
          this.bombAcc = 0;
          // a random alien at the bottom of its column fires
          const cols = {};
          this.aliens.forEach(a => { if (!cols[a.x] || cols[a.x].y < a.y) cols[a.x] = a; });
          const shooters = Object.values(cols);
          if (shooters.length){ const s = shooters[Math.floor(Math.random()*shooters.length)]; this.bombs.push({x: s.x + this.gx, y: s.y + this.gy + 1}); }
        }
        const bs = 0.010 * dt, ss = 0.022 * dt;
        this.bombs.forEach(b => b.y += bs);
        this.shots.forEach(s => s.y -= ss);
        // shots vs aliens / shields / bombs
        this.shots = this.shots.filter(s => {
          if (s.y < 0) return false;
          const ai = this.aliens.findIndex(a => a.x + this.gx === s.x && Math.abs(a.y + this.gy - s.y) < 0.7);
          if (ai >= 0){
            this.aliens.splice(ai, 1); this.score += 20 * this.level; sfx('hit');
            updateHUD(this.score, this.level, liveHi(this.score), t('live'), t('hi'));
            return false;
          }
          const si = this.shields.findIndex(b => b.x === s.x && Math.abs(b.y - s.y) < 0.7);
          if (si >= 0){ this.shields.splice(si, 1); return false; }
          const bi = this.bombs.findIndex(b => b.x === s.x && Math.abs(b.y - s.y) < 0.9);
          if (bi >= 0){ this.bombs.splice(bi, 1); this.score += 5; return false; }
          return true;
        });
        this.bombs = this.bombs.filter(b => {
          if (b.y >= ROWS) return false;
          const si = this.shields.findIndex(s => s.x === b.x && Math.abs(s.y - b.y) < 0.7);
          if (si >= 0){ this.shields.splice(si, 1); return false; }
          if (b.x === this.px && b.y >= ROWS - 2){
            this.lives--; this.drawSide(); sfx('die');
            if (this.lives <= 0) endGame(this);
            return false;
          }
          return true;
        });
        if (this.gameOver) return;
        if (!this.aliens.length){ this.level++; sfx('level'); this.wave(); updateHUD(this.score, this.level, liveHi(this.score), t('live'), t('hi')); }
      },
      fire(){
        if (this.shots.length < 2){ this.shots.push({x: this.px, y: ROWS - 3}); sfx('shoot'); }
      },
      draw(){
        clearBoard();
        const blink = Math.floor(performance.now() / 300) % 2;
        this.aliens.forEach(a => drawCell(a.x + this.gx, a.y + this.gy, true, (a.y % 2) === blink ? 1 : 0.8));
        this.shields.forEach(s => drawCell(s.x, s.y, true, 0.5));
        this.shots.forEach(s => drawCell(s.x, Math.floor(s.y)));
        this.bombs.forEach(b => drawCell(b.x, Math.floor(b.y), true, 0.7));
        drawCell(this.px, ROWS - 2);
        drawRect(this.px - 1, ROWS - 1, 3, 1);
      },
      onLeft(){ if (this.px > 0) this.px--; },
      onRight(){ if (this.px < COLS - 1) this.px++; },
      onUp(){ this.fire(); }, onDown(){},
      onA(){ this.fire(); }, onB(){ this.fire(); }
    };
  }

  // ========== GEMS (N) ==========
  // Falling trio of gems in a 6-wide well; line up 3+ of a kind in any direction.
  function makeGems(){
    const L = 2, R = 7;                 // well columns L..R
    const W = R - L + 1;
    function drawGem(x, y, type, alpha=1){
      if (y < 0) return;
      const pad = Math.max(1, cellSize*0.08), s = cellSize - pad*2;
      const X = x*cellSize + pad, Y = y*cellSize + pad;
      bctx.save(); bctx.globalAlpha = alpha; bctx.fillStyle = pixelOn; bctx.strokeStyle = pixelOn;
      bctx.lineWidth = Math.max(1, cellSize*0.12);
      if (type === 1) bctx.fillRect(X, Y, s, s);                                   // solid
      else if (type === 2) bctx.strokeRect(X + bctx.lineWidth/2, Y + bctx.lineWidth/2, s - bctx.lineWidth, s - bctx.lineWidth); // hollow
      else if (type === 3) bctx.fillRect(X + s*0.28, Y + s*0.28, s*0.44, s*0.44);  // dot
      else if (type === 4){ bctx.fillRect(X + s*0.38, Y, s*0.24, s); bctx.fillRect(X, Y + s*0.38, s, s*0.24); } // cross
      bctx.restore();
    }
    return {
      grid: null, x: 0, y: 0, gems: [1,2,3], nextGems: [1,2,3], acc: 0, interval: 800,
      score: 0, level: 1, cleared: 0, gameOver: false, flash: null, flashT: 0, chainMsg: '',
      rnd(){ return 1 + Math.floor(Math.random() * Math.min(4, 3 + (this.level >= 3 ? 1 : 0))); },
      init(){
        this.grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        this.level = levelSelect; this.score = 0; this.cleared = 0; this.gameOver = false;
        this.interval = Math.max(140, 850 - (speedSelect-1)*60 - (this.level-1)*40);
        this.nextGems = [this.rnd(), this.rnd(), this.rnd()];
        this.spawn();
        updateHUD(0, this.level, hiscore, t('next'), t('hi'));
      },
      spawn(){
        this.gems = this.nextGems;
        this.nextGems = [this.rnd(), this.rnd(), this.rnd()];
        this.x = L + Math.floor(W/2); this.y = -2; this.acc = 0;
        if (this.grid[0][this.x]) { endGame(this); return; }
        this.drawNext();
      },
      drawNext(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle = pixelOn; nctx.strokeStyle = pixelOn; nctx.lineWidth = 2;
        this.nextGems.forEach((g, i) => {
          const X = 24, Y = 3 + i*14, s = 12;
          if (g === 1) nctx.fillRect(X, Y, s, s);
          else if (g === 2) nctx.strokeRect(X+1, Y+1, s-2, s-2);
          else if (g === 3) nctx.fillRect(X+3, Y+3, s-6, s-6);
          else { nctx.fillRect(X+4, Y, 4, s); nctx.fillRect(X, Y+4, s, 4); }
        });
      },
      free(x, y){ return x >= L && x <= R && y < ROWS && (y < 0 || !this.grid[y][x]); },
      fits(x, y){ return this.free(x, y) && this.free(x, y+1) && this.free(x, y+2); },
      update(dt){
        if (this.gameOver) return;
        if (this.flashT > 0){
          this.flashT -= dt;
          if (this.flashT <= 0) this.collapse();
          return;
        }
        this.acc += dt;
        if (this.acc >= this.interval){ this.acc = 0; if (!this.step()) this.lock(); }
      },
      step(){ if (this.fits(this.x, this.y + 1)){ this.y++; return true; } return false; },
      lock(){
        if (this.y < 0){ endGame(this); return; }
        for (let i = 0; i < 3; i++) this.grid[this.y + i][this.x] = this.gems[i];
        sfx('lock');
        this.chain = 0;
        this.findMatches();
      },
      findMatches(){
        const hit = new Set();
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (let y = 0; y < ROWS; y++) for (let x = L; x <= R; x++){
          const g = this.grid[y][x]; if (!g) continue;
          for (const [dx, dy] of dirs){
            let n = 1;
            while (this.grid[y + dy*n] && this.grid[y + dy*n][x + dx*n] === g && x + dx*n <= R) n++;
            if (n >= 3) for (let k = 0; k < n; k++) hit.add((y + dy*k) * COLS + (x + dx*k));
          }
        }
        if (!hit.size){ this.spawn(); return; }
        this.chain++;
        this.flash = hit; this.flashT = 260;
        this.score += hit.size * 10 * this.level * this.chain;
        this.cleared += hit.size;
        sfx(this.chain > 1 ? 'level' : 'line');
        if (this.cleared >= this.level * 30){ this.level++; this.interval = Math.max(120, this.interval - 60); sfx('level'); }
        updateHUD(this.score, this.level, liveHi(this.score), t('next'), t('hi'));
      },
      collapse(){
        this.flash.forEach(i => { this.grid[Math.floor(i / COLS)][i % COLS] = 0; });
        this.flash = null;
        for (let x = L; x <= R; x++){
          const col = [];
          for (let y = ROWS - 1; y >= 0; y--) if (this.grid[y][x]) col.push(this.grid[y][x]);
          for (let y = ROWS - 1, k = 0; y >= 0; y--, k++) this.grid[y][x] = col[k] || 0;
        }
        this.findMatches();
      },
      draw(){
        clearBoard();
        for (let y = 0; y < ROWS; y++){ drawCell(L - 1, y, true, 0.3); drawCell(R + 1, y, true, 0.3); }
        const blink = Math.floor(performance.now() / 70) % 2;
        for (let y = 0; y < ROWS; y++) for (let x = L; x <= R; x++){
          const g = this.grid[y][x];
          if (g && !(this.flash && this.flash.has(y*COLS + x) && blink)) drawGem(x, y, g);
        }
        if (!this.flash && !this.gameOver){
          for (let i = 0; i < 3; i++) drawGem(this.x, this.y + i, this.gems[i]);
        }
      },
      busy(){ return this.gameOver || this.flash; },
      onLeft(){ if (!this.busy() && this.fits(this.x - 1, this.y)){ this.x--; sfx('move'); } },
      onRight(){ if (!this.busy() && this.fits(this.x + 1, this.y)){ this.x++; sfx('move'); } },
      onDown(){ if (this.busy()) return; if (!this.step()) this.lock(); else this.score += 1; },
      onUp(){ this.onA(); },
      onA(){ if (this.busy()) return; this.gems.unshift(this.gems.pop()); sfx('rotate'); },
      onB(){ if (this.busy()) return; while (this.step()) this.score += 2; this.lock(); sfx('drop'); }
    };
  }

  // ========== MAZE (O) ==========
  // Eat every dot; chasers cost a life unless a power dot (o) is active.
  const MAZE = [
    '##########',
    '#o......o#',
    '#.##..##.#',
    '#.#....#.#',
    '#...##...#',
    '##.#..#.##',
    '#........#',
    '#.##..##.#',
    '#.#.GG.#.#',
    '#...##...#',
    '##.#..#.##',
    '#........#',
    '#.##..##.#',
    '#o.#..#.o#',
    '#...##...#',
    '#.#....#.#',
    '#.#.##.#.#',
    '#....P...#',
    '#.##..##.#',
    '##########',
  ];
  function makeMaze(){
    const DIRS = [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}];
    const wall = (x, y) => y < 0 || y >= ROWS || x < 0 || x >= COLS || MAZE[y][x] === '#';
    return {
      dots: null, left: 0, p: null, ghosts: [], score: 0, level: 1, lives: 3, gameOver: false,
      pAcc: 0, gAcc: 0, power: 0, combo: 0, startDelay: 0,
      init(){
        this.level = levelSelect; this.score = 0; this.lives = 3; this.gameOver = false;
        this.board();
        updateHUD(0, this.level, hiscore, t('live'), t('hi'));
        this.drawSide();
      },
      drawSide(){ drawHearts(this.lives); },
      board(){
        this.dots = MAZE.map(row => [...row].map(ch => ch === '.' ? 1 : ch === 'o' ? 2 : 0));
        this.left = this.dots.flat().filter(Boolean).length;
        this.place();
      },
      place(){
        this.ghosts = [];
        MAZE.forEach((row, y) => [...row].forEach((ch, x) => {
          if (ch === 'P') this.p = {x, y, dir: 3, want: 3};
          if (ch === 'G') this.ghosts.push({x, y, home: {x, y}, dir: 0, eaten: 0});
        }));
        this.power = 0; this.startDelay = 900;
      },
      pStep(){ return Math.max(95, 210 - speedSelect*10 - this.level*5); },
      gStep(){ return this.power > 0 ? 330 : Math.max(120, 300 - speedSelect*12 - this.level*15); },
      update(dt){
        if (this.gameOver) return;
        if (this.startDelay > 0){ this.startDelay -= dt; return; }
        if (this.power > 0) this.power -= dt;
        this.pAcc += dt; this.gAcc += dt;
        if (this.pAcc >= this.pStep()){ this.pAcc = 0; this.movePlayer(); }
        if (this.gameOver) return;
        if (this.gAcc >= this.gStep()){ this.gAcc = 0; this.ghosts.forEach(g => this.moveGhost(g)); }
        this.collide();
      },
      movePlayer(){
        const p = this.p, w = DIRS[p.want];
        if (!wall(p.x + w.x, p.y + w.y)) p.dir = p.want;
        const m = DIRS[p.dir];
        if (!wall(p.x + m.x, p.y + m.y)){ p.x += m.x; p.y += m.y; }
        const v = this.dots[p.y][p.x];
        if (v){
          this.dots[p.y][p.x] = 0; this.left--;
          this.score += v === 2 ? 50 : 10;
          if (v === 2){ this.power = 6000 - this.level*300; this.combo = 0; sfx('level'); } else sfx('eat');
          updateHUD(this.score, this.level, liveHi(this.score), t('live'), t('hi'));
          if (this.left === 0){ award('mazeClear'); this.level++; sfx('level'); this.board(); }
        }
        this.collide();
      },
      moveGhost(g){
        if (g.eaten > 0){ g.eaten--; return; }
        const p = this.p;
        const opts = [];
        DIRS.forEach((d, i) => {
          if (i === (g.dir + 2) % 4) return;              // no U-turns
          if (!wall(g.x + d.x, g.y + d.y)) opts.push(i);
        });
        if (!opts.length) opts.push((g.dir + 2) % 4);
        const dist = i => Math.abs(g.x + DIRS[i].x - p.x) + Math.abs(g.y + DIRS[i].y - p.y);
        let pick;
        if (this.power > 0) pick = opts.reduce((a, b) => dist(a) >= dist(b) ? a : b);        // flee
        else if (Math.random() < 0.2) pick = opts[Math.floor(Math.random() * opts.length)];   // a little randomness
        else pick = opts.reduce((a, b) => dist(a) <= dist(b) ? a : b);                        // chase
        g.dir = pick; g.x += DIRS[pick].x; g.y += DIRS[pick].y;
      },
      collide(){
        for (const g of this.ghosts){
          if (g.eaten > 0 || g.x !== this.p.x || g.y !== this.p.y) continue;
          if (this.power > 0){
            this.combo++; this.score += 100 * this.combo; sfx('score');
            g.x = g.home.x; g.y = g.home.y; g.eaten = 6;
            updateHUD(this.score, this.level, liveHi(this.score), t('live'), t('hi'));
          } else {
            this.lives--; this.drawSide(); sfx('die');
            if (this.lives <= 0){ endGame(this); return; }
            this.place();
            return;
          }
        }
      },
      draw(){
        clearBoard();
        const blink = Math.floor(performance.now() / 160) % 2;
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
          if (MAZE[y][x] === '#') drawCell(x, y, true, 0.28);
          else if (this.dots[y][x] === 1){
            const pad = cellSize*0.36;
            bctx.fillStyle = pixelOn; bctx.fillRect(x*cellSize + pad, y*cellSize + pad, cellSize - pad*2, cellSize - pad*2);
          } else if (this.dots[y][x] === 2 && blink) drawGhostCell(x, y);
        }
        // chasers: ring with a centre dot; while powered up only the (blinking) ring
        this.ghosts.forEach(g => {
          if (g.eaten > 0) return;
          if (this.power > 0){ if (this.power > 1500 || blink) drawGhostCell(g.x, g.y); return; }
          drawGhostCell(g.x, g.y); drawGhostCell(g.x, g.y);
          const pad = cellSize*0.34;
          bctx.fillStyle = pixelOn; bctx.fillRect(g.x*cellSize + pad, g.y*cellSize + pad, cellSize - pad*2, cellSize - pad*2);
        });
        drawCell(this.p.x, this.p.y, true, this.startDelay > 0 && blink ? 0.3 : 1);
      },
      onUp(){ this.p.want = 0; }, onRight(){ this.p.want = 1; },
      onDown(){ this.p.want = 2; }, onLeft(){ this.p.want = 3; },
      onA(){}, onB(){}
    };
  }

  // ========== RALLY (P) ==========
  // Two-lane racer with classic brick-game cars, fuel and turbo.
  function makeRally(){
    const CAR = ['.#.', '###', '.#.', '#.#'];
    const LANES = [2, 5];
    function drawCar(x, y, alpha=1){
      CAR.forEach((row, dy) => [...row].forEach((ch, dx) => { if (ch === '#') drawCell(x + dx, Math.floor(y) + dy, true, alpha); }));
    }
    return {
      lane: 0, cars: [], fuelCans: [], fuel: 100, turbo: 0, scroll: 0, spawnAcc: 0,
      score: 0, level: 1, gameOver: false, passed: 0,
      init(){
        this.level = levelSelect; this.score = 0; this.gameOver = false;
        this.lane = 0; this.cars = []; this.fuelCans = []; this.fuel = 100; this.turbo = 0; this.passed = 0;
        this.spawnAcc = 0;
        updateHUD(0, this.level, hiscore, t('mode'), t('hi'));
        this.drawSide();
      },
      drawSide(){ drawIcon(nctx, nextCanvas, MODES_BY_ID.P.icon); this.fuelPanel(); },
      fuelPanel(){ setExtra(t('fuel'), Math.max(0, Math.ceil(this.fuel)) + '%'); },
      speed(){ return (0.010 + speedSelect*0.0009 + this.level*0.0008) * (this.turbo > 0 ? 1.6 : 1); },
      update(dt){
        if (this.gameOver) return;
        const v = this.speed() * dt;
        this.scroll += v;
        if (this.turbo > 0) this.turbo -= dt;
        // fuel
        this.fuel -= dt * (this.turbo > 0 ? 0.006 : 0.0032);
        if (Math.floor(this.fuel) !== this.lastFuel){ this.lastFuel = Math.floor(this.fuel); this.fuelPanel(); }
        if (this.fuel <= 0){ endGame(this); return; }
        // traffic
        this.cars.forEach(c => c.y += v * 0.55);
        this.fuelCans.forEach(f => f.y += v);
        this.cars = this.cars.filter(c => {
          if (c.y > ROWS){ this.passed++; this.score += this.turbo > 0 ? 20 : 10; this.levelCheck(); this.hud(); return false; }
          return true;
        });
        this.fuelCans = this.fuelCans.filter(f => f.y <= ROWS);
        this.spawnAcc += dt;
        const gap = Math.max(650, 1700 - this.level*90 - speedSelect*40) / (this.turbo > 0 ? 1.4 : 1);
        if (this.spawnAcc >= gap){
          this.spawnAcc = 0;
          const lane = Math.floor(Math.random()*2);
          // keep a clear gap between cars so there is always a way through
          if (!this.cars.some(c => c.y < 5)) this.cars.push({lane, y: -4});
          if (Math.random() < 0.18) this.fuelCans.push({lane: 1 - lane, y: -1});
        }
        // collisions (player car rows ROWS-4..ROWS-1)
        const py = ROWS - 4;
        for (const c of this.cars) if (c.lane === this.lane && c.y + 4 > py + 0.3 && c.y < py + 3.7){ endGame(this, 'crash'); return; }
        this.fuelCans = this.fuelCans.filter(f => {
          if (f.lane === this.lane && f.y + 1 > py && f.y < py + 4){ this.fuel = Math.min(100, this.fuel + 35); sfx('eat'); this.score += 25; this.hud(); this.fuelPanel(); return false; }
          return true;
        });
      },
      levelCheck(){ if (this.passed % 15 === 0){ this.level++; sfx('level'); } },
      hud(){ updateHUD(this.score, this.level, liveHi(this.score), t('mode'), t('hi')); },
      draw(){
        clearBoard();
        const off = Math.floor(this.scroll) % 4;
        for (let y = 0; y < ROWS; y++) if ((y + 4 - off) % 4 !== 0){ drawCell(0, y, true, 0.6); drawCell(COLS-1, y, true, 0.6); }
        this.cars.forEach(c => drawCar(LANES[c.lane], c.y));
        const blink = Math.floor(performance.now() / 150) % 2;
        this.fuelCans.forEach(f => drawCell(LANES[f.lane] + 1, Math.floor(f.y), true, blink ? 1 : 0.4));
        drawCar(LANES[this.lane], ROWS - 4);
      },
      onLeft(){ if (this.lane > 0){ this.lane--; sfx('move'); } },
      onRight(){ if (this.lane < 1){ this.lane++; sfx('move'); } },
      onUp(){ this.onB(); }, onDown(){ this.turbo = 0; },
      onA(){ this.onB(); },
      onB(){ if (this.fuel > 5){ this.turbo = 1500; sfx('start'); } }
    };
  }

  // ========== MAIN LOOP ==========
  function loop(ts){
    if (!lastTs) lastTs=ts;
    const dt = Math.min(50, ts-lastTs);
    lastTs=ts;
    pollGamepad(ts);
    if (state==='play' && G){
      G.update(dt);
      if (state==='play') G.draw();
      stats.timeMs += dt;
      if (stats.timeMs >= 30*60000) award('marathon');
    } else if (state==='menu') drawMenu();
    else if (state==='level') drawLevelSelect();
    else if (state==='settings') drawSettings();
    // keep button layout + captions in sync with the current screen
    applyBigLayout();
    updateButtonLabels();
    requestAnimationFrame(loop);
  }

  // ========== CONTROLS DISPATCH ==========
  function handleDir(dir){
    if (state==='menu'){
      if (dir==='up'){ menuIndex = (menuIndex-1+MENU_ITEMS.length)%MENU_ITEMS.length; sfx('select'); drawMenu(); }
      if (dir==='down'){ menuIndex = (menuIndex+1)%MENU_ITEMS.length; sfx('select'); drawMenu(); }
      return;
    }
    if (state==='initials'){
      const i = INIT_CHARS.indexOf(initials[initPos]);
      if (dir==='up') initials[initPos] = INIT_CHARS[(i+1) % INIT_CHARS.length];
      if (dir==='down') initials[initPos] = INIT_CHARS[(i-1+INIT_CHARS.length) % INIT_CHARS.length];
      if (dir==='left') initPos = Math.max(0, initPos-1);
      if (dir==='right') initPos = Math.min(2, initPos+1);
      sfx('select'); showInitials();
      return;
    }
    if (state==='stats' || state==='awards') return;
    if (state==='level' && MENU_ITEMS[menuIndex].kind === 'daily') return;   // daily settings are fixed
    if (state==='level'){
      if (dir==='left'){ levelSelect=Math.max(1,levelSelect-1); sfx('select'); drawLevelSelect(); }
      if (dir==='right'){ levelSelect=Math.min(9,levelSelect+1); sfx('select'); drawLevelSelect(); }
      if (dir==='up'){ speedSelect=Math.min(9,speedSelect+1); sfx('select'); drawLevelSelect(); }
      if (dir==='down'){ speedSelect=Math.max(1,speedSelect-1); sfx('select'); drawLevelSelect(); }
      return;
    }
    if (state==='settings'){
      if (dir==='up'){ settingsIndex = (settingsIndex - 1 + SETTINGS_OPTS.length) % SETTINGS_OPTS.length; sfx('select'); drawSettings(); }
      if (dir==='down'){ settingsIndex = (settingsIndex + 1) % SETTINGS_OPTS.length; sfx('select'); drawSettings(); }
      if (dir==='left' || dir==='right'){
        const opt = SETTINGS_OPTS[settingsIndex];
        if (opt.cycle) opt.set(dir==='left' ? -1 : 1);
        else opt.set(!opt.get());
        sfx('select');
        drawSettings();
      }
      return;
    }
    if (state==='pause'){
      if (dir==='up'){ pauseIndex = (pauseIndex-1+PAUSE_OPTS.length)%PAUSE_OPTS.length; sfx('select'); showPauseMenu(); }
      if (dir==='down'){ pauseIndex = (pauseIndex+1)%PAUSE_OPTS.length; sfx('select'); showPauseMenu(); }
      return;
    }
    if (state==='play' && G){
      if (dir==='left') G.onLeft();
      if (dir==='right') G.onRight();
      if (dir==='up') G.onUp();
      if (dir==='down') G.onDown();
      if (state==='play') G.draw();
    }
  }
  function openMenuItem(){
    const kind = MENU_ITEMS[menuIndex].kind;
    hideOverlay(); sfx('select');
    if (kind === 'stats'){ state = 'stats'; drawStats(); }
    else if (kind === 'awards'){ state = 'awards'; drawAwards(); }
    else { state = 'level'; drawLevelSelect(); }
  }
  function backToMenu(){ state = 'menu'; sfx('select'); drawMenu(); }
  function handleA(){
    if (state==='menu'){ openMenuItem(); return; }
    if (state==='stats' || state==='awards'){ backToMenu(); return; }
    if (state==='initials'){ confirmInitials(); return; }
    if (state==='level'){ startPlay(); return; }
    if (state==='settings'){ closeSettings(); return; }
    if (state==='play' && G){ G.onA(); if (state==='play') G.draw(); return; }
    if (state==='pause'){ choosePause(); return; }
    if (state==='over') startPlay();
  }
  function handleB(){
    if (state==='play' && G){ G.onB(); if (state==='play') G.draw(); return; }
    if (state==='menu') { handleA(); return; }
    if (state==='level' || state==='stats' || state==='awards'){ backToMenu(); return; }
    if (state==='initials'){ confirmInitials(); return; }
    if (state==='over'){ shareResult(); return; }
    if (state==='settings'){ closeSettings(); return; }
    if (state==='pause'){ togglePause(); return; }
  }
  function togglePause(){
    if (state==='play'){
      state='pause';
      pauseIndex = 0;
      applyBigLayout();
      showPauseMenu();
    } else if (state==='pause'){
      state='play'; hideOverlay(); lastTs=performance.now();
      applyBigLayout();
    } else if (state==='menu'){
      openMenuItem();
      applyBigLayout();
    } else if (state==='stats' || state==='awards'){
      backToMenu();
    } else if (state==='initials'){
      confirmInitials();
    } else if (state==='level'){
      startPlay();
    } else if (state==='settings'){
      closeSettings();
    } else if (state==='over'){
      startPlay();
    }
  }
  function startPlay(){
    const it = MENU_ITEMS[menuIndex];
    playingDaily = it.kind === 'daily';
    if (playingDaily){
      // fixed level/speed and a seeded random sequence shared by everyone today
      const d = dailyInfo();
      currentMode = d.mode;
      levelSelect = d.level; speedSelect = d.speed;
      Math.random = seededRandom(d.key + d.mode.id);
      const top = loadTop(d.key); hiscore = top.length ? top[0].s : 0;
    } else {
      Math.random = nativeRandom;
      currentMode = it.mode;
      hiscore = loadHi(currentMode.id);
    }
    stats.played[currentMode.id] = (stats.played[currentMode.id] || 0) + 1;
    saveStats();
    award('first');
    if (MODES.every(m => stats.played[m.id])) award('all');
    setExtra(null);
    nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
    G = currentMode.make();
    G.init();
    state='play';
    hideOverlay();
    applyBigLayout();
    sfx('start');
    lastTs = performance.now();
  }
  let hudSnapshot = null;
  function openSettings(){
    if (!['menu', 'level', 'pause'].includes(state)) return; // pause first
    prevStateBeforeSettings = state;
    // remember the in-game side panel so it can be restored after settings
    hudSnapshot = state === 'pause' ? [scoreEl, levelEl, hiscoreEl, sideLabel1, sideLabel2, extraLabel, extraVal]
      .map(el => el.textContent).concat([extraPanel.hidden]) : null;
    state = 'settings';
    settingsIndex = 0;
    hideOverlay();
    applyBigLayout();
    sfx('select');
    drawSettings();
  }
  function closeSettings(){
    const back = prevStateBeforeSettings;
    sfx('select');
    if (back === 'pause' && G){
      state = 'pause';
      if (hudSnapshot){
        [scoreEl, levelEl, hiscoreEl, sideLabel1, sideLabel2, extraLabel, extraVal]
          .forEach((el, i) => { el.textContent = hudSnapshot[i]; });
        extraPanel.hidden = hudSnapshot[7];
      }
      nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
      if (G.drawSide) G.drawSide();
      if (G.drawNext) G.drawNext();
    } else state = back === 'level' ? 'level' : 'menu';
    applyBigLayout();
    redrawScreen();
  }
  function doReset(){
    if (G && currentMode && !G.gameOver && !playingDaily) saveHi(currentMode.id, G.score);
    if (playingDaily){ Math.random = nativeRandom; playingDaily = false; levelSelect = 1; speedSelect = 1; }
    saveStats();
    state='menu';
    G=null;
    hideOverlay();
    applyBigLayout();
    drawMenu();
  }

  // bind buttons
  bindHoldable(document.getElementById('btnLeft'), ()=>handleDir('left'));
  bindHoldable(document.getElementById('btnRight'), ()=>handleDir('right'));
  bindHoldable(document.getElementById('btnUp'), ()=>handleDir('up'));
  bindHoldable(document.getElementById('btnDown'), ()=>handleDir('down'));
  bindTap(document.getElementById('btnA'), handleA);
  bindTap(document.getElementById('btnB'), handleB);
  bindTap(document.getElementById('btnStart'), togglePause);
  bindTap(document.getElementById('btnReset'), doReset);
  bindTap(document.getElementById('btnSettings'), ()=>{
    if (state === 'play') togglePause();
    if (state === 'pause') { pauseIndex = PAUSE_OPTS.indexOf('settings'); openSettings(); }
    else openSettings();
  });
  bindTap(document.getElementById('btnSound'), ()=>{ setSound(!soundOn); sfx('select'); });

  document.addEventListener('keydown', (e)=>{
    // a focused on-screen button handles Enter/Space itself (as a click)
    if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    let handled = true;
    switch(e.key){
      case 'ArrowLeft': case 'a': case 'A': handleDir('left'); break;
      case 'ArrowRight': case 'd': case 'D': handleDir('right'); break;
      case 'ArrowUp': case 'w': case 'W': handleDir('up'); break;
      case 'ArrowDown': case 's': case 'S': handleDir('down'); break;
      case ' ': case 'Enter': togglePause(); break;
      case 'z': case 'Z': case 'j': case 'J': handleA(); break;
      case 'x': case 'X': case 'k': case 'K': handleB(); break;
      case 'r': case 'R': doReset(); break;
      case 'm': case 'M': setSound(!soundOn); break;
      case 'c': case 'C': case 'Shift': if (state==='play' && G && G.hold){ G.hold(); G.draw(); } break;
      case 'o': case 'O': case ',': document.getElementById('btnSettings').dispatchEvent(new Event('pointerdown')); break;
      case 'Escape': case 'p': case 'P': if (state==='play' || state==='pause') togglePause(); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  // ========== SWIPE / TAP ON THE SCREEN ==========
  // drag = repeated moves (one per ~28px), tap = A, fast flick down = hard drop (brick games)
  (function(){
    const STEP = 28;
    let sx=0, sy=0, ox=0, oy=0, t0=0, moved=false, tracking=false, flickedUp=false;
    screenEl.addEventListener('touchstart', e => {
      if (!swipeOn || e.touches.length !== 1) { tracking = false; return; }
      const p = e.touches[0];
      sx = ox = p.clientX; sy = oy = p.clientY; t0 = performance.now();
      moved = false; tracking = true; flickedUp = false;
    }, {passive:true});
    screenEl.addEventListener('touchmove', e => {
      if (!tracking) return;
      const p = e.touches[0];
      let dx = p.clientX - ox, dy = p.clientY - oy;
      while (Math.abs(dx) >= STEP && Math.abs(dx) >= Math.abs(dy)) {
        handleDir(dx > 0 ? 'right' : 'left'); moved = true;
        ox += dx > 0 ? STEP : -STEP; dx = p.clientX - ox;
      }
      while (dy >= STEP && dy > Math.abs(dx)) {
        if (state !== 'play' || !currentMode || !currentMode.flick) handleDir('down');
        moved = true; oy += STEP; dy = p.clientY - oy;
      }
      // up = rotate/jump in games (once per swipe), scrolls repeatedly in menus
      if (dy <= -STEP && (state !== 'play' || !flickedUp)) { handleDir('up'); moved = true; flickedUp = true; oy -= STEP; }
    }, {passive:true});
    screenEl.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const p = e.changedTouches[0];
      const dt = performance.now() - t0, dy = p.clientY - sy, dx = p.clientX - sx;
      if (!moved && Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 300) { handleA(); return; }
      // brick games: a downward flick drops; a slow drag soft-drops
      if (state === 'play' && currentMode && currentMode.flick && dy > STEP) {
        if (dy / dt > 0.6) handleB();
        else for (let i = 0; i < Math.floor(dy / STEP); i++) handleDir('down');
      }
    }, {passive:true});
  })();

  // one-finger drags must not scroll the page; pinch-zoom stays available
  document.addEventListener('touchmove', e=>{ if (e.touches.length === 1) e.preventDefault(); }, {passive:false});
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,200));
  // auto-pause when switching apps / tabs
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden) return;
    if (G && currentMode && !G.gameOver && !playingDaily) saveHi(currentMode.id, G.score);
    saveStats();
    if (state==='play') togglePause();
  });

  // test hook for the automated tests (only with ?test in the URL)
  if (/[?&]test\b/.test(location.search)) window.__T = {
    get G(){ return G; }, get state(){ return state; },
    get menuIndex(){ return menuIndex; }, set menuIndex(v){ menuIndex = v; },
    startMode(i){ menuIndex = i + 1; startPlay(); }, startDaily(){ menuIndex = 0; startPlay(); },
    MAZE, MODES, stats, unlocked, dailyInfo, loadTop, isNativeRandom: () => Math.random === nativeRandom,
  };

  // boot
  state='menu';
  applyTheme(theme);
  resizeCanvas();
  hideOverlay();
  applyLanguage();
  applyBigLayout();
  drawMenu();
  requestAnimationFrame(loop);

  // PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
