<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BRICK GAME 9999 IN 1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9c3b3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brick Game">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --shell: #c9c3b3;
    --shell-dark: #a89f8a;
    --screen-bg: #9db89a;
    --screen-bg2: #93af8f;
    --pixel-on: #2b3a2c;
    --pixel-off: #7f9d7d;
    --btn: #3c3c3c;
    --btn-dark: #232323;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #6b6558;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none;
    font-family: 'VT323', monospace;
  }
  .device {
    width: min(94vw, 420px);
    height: min(96vh, 820px);
    background: linear-gradient(145deg, var(--shell), var(--shell-dark));
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.4);
    padding: 16px 16px 10px;
    display: flex; flex-direction: column;
    gap: 10px;
  }
  .brand {
    text-align: center; color: #5a5343; font-size: 16px; letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  .screen-wrap {
    background: #4b4a3f;
    border-radius: 8px;
    padding: 10px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .screen {
    background: linear-gradient(160deg, var(--screen-bg), var(--screen-bg2));
    border-radius: 4px;
    flex: 1;
    display: flex;
    padding: 8px;
    gap: 8px;
    min-height: 0;
    position: relative;
  }
  .board-area { flex: 1; display: flex; position: relative; }
  canvas#board { width: 100%; height: 100%; image-rendering: pixelated; }
  .side {
    width: 76px;
    display: flex; flex-direction: column; gap: 6px;
    color: var(--pixel-on);
  }
  .panel {
    border: 2px solid var(--pixel-on);
    border-radius: 3px;
    padding: 4px;
    text-align: center;
  }
  .panel .lbl { font-size: 11px; letter-spacing: 1px; opacity: 0.8; }
  .panel .val { font-size: 20px; line-height: 1.1; }
  canvas#next { width: 100%; height: 48px; image-rendering: pixelated; }
  .overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
    background: rgba(157,184,154,0.94);
    color: var(--pixel-on);
    font-size: 22px; text-align: center;
    letter-spacing: 1px;
    z-index: 10;
    padding: 8px;
  }
  .overlay.show { display: flex; }
  .overlay .small { font-size: 14px; opacity: 0.85; line-height: 1.3; }
  .overlay .tiny { font-size: 12px; opacity: 0.7; margin-top: 6px; }
  .menu-list { font-size: 18px; line-height: 1.45; text-align: left; width: 100%; max-width: 200px; }
  .menu-list .sel { background: var(--pixel-on); color: var(--screen-bg); padding: 0 4px; }
  .controls {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px 2px;
  }
  .dpad {
    position: relative;
    width: 116px; height: 116px;
  }
  .dbtn {
    position: absolute;
    background: linear-gradient(160deg, var(--btn), var(--btn-dark));
    border-radius: 6px;
    box-shadow: 0 3px 0 #111, inset 0 1px 1px rgba(255,255,255,0.15);
    color: #ccc; display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .dbtn:active, .dbtn.active-press { box-shadow: 0 1px 0 #111; transform: translateY(2px); background: linear-gradient(160deg, #565656, #2a2a2a); }
  .d-left  { left: 0; top: 38px; width: 38px; height: 40px; border-radius: 8px 2px 2px 8px;}
  .d-right { right: 0; top: 38px; width: 38px; height: 40px; border-radius: 2px 8px 8px 2px;}
  .d-up    { left: 39px; top: 0; width: 38px; height: 38px; border-radius: 8px 8px 2px 2px;}
  .d-down  { left: 39px; bottom: 0; width: 38px; height: 38px; border-radius: 2px 2px 8px 8px;}
  .d-center{ left: 39px; top: 38px; width: 38px; height: 40px; background: var(--shell-dark); box-shadow:none; }

  /* ===== BIG 3-BUTTON MODE: large ↓ ◀ ▶ (no up) ===== */
  .controls.big-mode .dpad {
    width: 168px; height: 120px;
  }
  .controls.big-mode .d-up,
  .controls.big-mode .d-center {
    display: none !important;
  }
  .controls.big-mode .d-left {
    left: 0; top: 24px; width: 56px; height: 72px;
    border-radius: 12px; font-size: 26px;
  }
  .controls.big-mode .d-right {
    right: 0; top: 24px; width: 56px; height: 72px;
    border-radius: 12px; font-size: 26px;
  }
  .controls.big-mode .d-down {
    left: 56px; bottom: 0; top: auto; width: 56px; height: 56px;
    border-radius: 12px; font-size: 24px;
  }
  .controls.big-mode .abtns {
    gap: 8px;
  }
  .controls.big-mode .round {
    width: 64px; height: 64px; font-size: 15px;
  }

  .abtns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .round {
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(160deg, #7a2b2b, #4a1616);
    box-shadow: 0 4px 0 #2a0d0d, inset 0 1px 1px rgba(255,255,255,0.25);
    color: #f0d9d9; font-size: 14px; display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.1;
  }
  .round.blue {
    background: linear-gradient(160deg, #2b4a7a, #16294a);
    box-shadow: 0 4px 0 #0d1f2a, inset 0 1px 1px rgba(255,255,255,0.25);
    color: #d9e4f0;
  }
  .round:active, .round.active-press { box-shadow: 0 1px 0 #2a0d0d; transform: translateY(3px); }

  .bottom-row {
    display: flex; justify-content: center; gap: 12px; padding: 4px 0 2px; flex-wrap: wrap;
  }
  .pill {
    background: linear-gradient(160deg, #555, #2c2c2c);
    color: #ccc; border-radius: 12px; padding: 6px 12px;
    font-size: 12px; letter-spacing: 1px;
    box-shadow: 0 3px 0 #111;
  }
  .pill:active { box-shadow: 0 1px 0 #111; transform: translateY(2px); }
</style>
</head>
<body>
<div class="device">
  <div class="brand">BRICK GAME &middot; 9999 IN 1</div>
  <div class="screen-wrap">
    <div class="screen">
      <div class="board-area"><canvas id="board"></canvas></div>
      <div class="side">
        <div class="panel">
          <div class="lbl" id="sideLabel1">NEXT</div>
          <canvas id="next" width="60" height="48"></canvas>
        </div>
        <div class="panel">
          <div class="lbl">SCORE</div>
          <div class="val" id="score">0</div>
        </div>
        <div class="panel">
          <div class="lbl">LEVEL</div>
          <div class="val" id="level">1</div>
        </div>
        <div class="panel">
          <div class="lbl" id="sideLabel2">HI</div>
          <div class="val" id="hiscore">0</div>
        </div>
      </div>
      <div class="overlay" id="overlay">
        <div id="overlayTitle">BRICK GAME</div>
        <div class="small" id="overlaySub">9999 IN 1</div>
        <div class="tiny" id="overlayTiny">press START</div>
      </div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="pill" id="btnStart">START/PAUSE</div>
    <div class="pill" id="btnSound">SOUND</div>
    <div class="pill" id="btnSettings">SET</div>
    <div class="pill" id="btnReset">RESET</div>
  </div>
  <div class="controls">
    <div class="dpad">
      <div class="dbtn d-up" id="btnUp">▲</div>
      <div class="dbtn d-left" id="btnLeft">◀</div>
      <div class="dbtn d-right" id="btnRight">▶</div>
      <div class="dbtn d-down" id="btnDown">▼</div>
      <div class="dbtn d-center"></div>
    </div>
    <div class="abtns">
      <div class="round" id="btnA">A<br>ROT</div>
      <div class="round blue" id="btnB">B<br>DROP</div>
    </div>
  </div>
</div>

<script>
(function(){
  // ========== AUDIO & SETTINGS ==========
  let soundOn   = localStorage.getItem('bg_sound')  !== '0';
  let bigMode = localStorage.getItem('bg_big')  === '1'; // 3 big buttons ↓◀▶, default OFF
  let ghostOn   = localStorage.getItem('bg_ghost')  !== '0'; // Tetris ghost piece
  let holdRepeat= localStorage.getItem('bg_hold')   !== '0'; // classic hold-to-repeat
  let greenScreen = localStorage.getItem('bg_green') === '1'; // pure green LCD
  let lang = localStorage.getItem('bg_lang') || 'en'; // 'en' | 'el'
  const audioCtx = window.AudioContext ? new AudioContext() : null;

  // ===== i18n =====
  const I18N = {
    en: {
      brand: 'BRICK GAME · 9999 IN 1',
      selectGame: 'SELECT GAME',
      startOk: 'START = OK',
      move: '▲▼  move',
      game: 'GAME',
      level: 'LEVEL',
      speed: 'SPEED',
      startPlay: 'START = play',
      settings: 'SETTINGS',
      big: 'BIG 3',
      hold: 'HOLD',
      ghost: 'GHOST',
      green: 'GREEN',
      sound: 'SOUND',
      lang: 'LANG',
      select: '▲▼ select',
      change: '◀▶ change',
      back: 'START=back',
      paused: 'PAUSED',
      resume: 'press START to resume',
      gameOver: 'GAME OVER',
      crash: 'CRASH!',
      score: 'SCORE',
      pressReset: 'press RESET or START',
      mode: 'MODE',
      hi: 'HI',
      next: 'NEXT',
      live: 'LIVE',
      cars: 'CARS',
      food: 'FOOD',
      set: 'SET',
      on: 'ON ',
      off: 'OFF',
      startPause: 'START/PAUSE',
      soundBtn: 'SOUND',
      muteBtn: 'MUTE',
      reset: 'RESET',
      rot: 'A\nROT',
      drop: 'B\nDROP',
    },
    el: {
      brand: 'BRICK GAME · 9999 ΣΕ 1',
      selectGame: 'ΕΠΙΛΟΓΗ ΠΑΙΧΝΙΔΙΟΥ',
      startOk: 'START = OK',
      move: '▲▼  μετακίνηση',
      game: 'ΠΑΙΧΝΙΔΙ',
      level: 'ΕΠΙΠΕΔΟ',
      speed: 'ΤΑΧΥΤΗΤΑ',
      startPlay: 'START = έναρξη',
      settings: 'ΡΥΘΜΙΣΕΙΣ',
      big: 'ΜΕΓ 3',
      hold: 'ΚΡΑΤΗΜΑ',
      ghost: 'ΣΚΙΑ',
      green: 'ΠΡΑΣΙΝΟ',
      sound: 'ΗΧΟΣ',
      lang: 'ΓΛΩΣΣΑ',
      select: '▲▼ επιλογή',
      change: '◀▶ αλλαγή',
      back: 'START=πίσω',
      paused: 'ΠΑΥΣΗ',
      resume: 'πάτα START για συνέχεια',
      gameOver: 'ΤΕΛΟΣ',
      crash: 'ΣΥΝΤΡΙΒΗ!',
      score: 'ΣΚΟΡ',
      pressReset: 'πάτα RESET ή START',
      mode: 'MODE',
      hi: 'HI',
      next: 'ΕΠΟΜ',
      live: 'ΖΩΕΣ',
      cars: 'ΑΥΤ/ΤΑ',
      food: 'ΦΑΓΗΤΟ',
      set: 'SET',
      on: 'ΝΑΙ',
      off: 'ΟΧΙ',
      startPause: 'START/ΠΑΥΣΗ',
      soundBtn: 'ΗΧΟΣ',
      muteBtn: 'ΣΙΩΠΗ',
      reset: 'RESET',
      rot: 'A\nΠΕΡ',
      drop: 'B\nDROP',
    }
  };
  function t(key){ return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }

  function applyBigLayout(){
    // Big L/R buttons only while actually playing a game
    const controls = document.querySelector('.controls');
    if (controls) controls.classList.toggle('big-mode', !!(bigMode && state === 'play'));
  }

  function applyLanguage(){
    document.querySelector('.brand').textContent = t('brand');
    document.getElementById('btnStart').textContent = t('startPause');
    document.getElementById('btnSound').textContent = soundOn ? t('soundBtn') : t('muteBtn');
    document.getElementById('btnSettings').textContent = t('set');
    document.getElementById('btnReset').textContent = t('reset');
    const btnA = document.getElementById('btnA');
    const btnB = document.getElementById('btnB');
    if (btnA) btnA.innerHTML = t('rot').replace('\n','<br>');
    if (btnB) btnB.innerHTML = t('drop').replace('\n','<br>');
    // redraw current screen
    if (typeof state !== 'undefined') {
      if (state === 'menu') drawMenu();
      else if (state === 'level') drawLevelSelect();
      else if (state === 'settings') drawSettings();
    }
  }

  function beep(freq, dur, type='square', vol=0.08){
    if (!soundOn || !audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }
  function sfx(name){
    if (!soundOn) return;
    switch(name){
      case 'move': beep(220, 0.04); break;
      case 'rotate': beep(330, 0.06); break;
      case 'drop': beep(110, 0.08); break;
      case 'lock': beep(180, 0.1); break;
      case 'line': beep(440, 0.12); setTimeout(()=>beep(550,0.12),80); setTimeout(()=>beep(660,0.15),160); break;
      case 'score': beep(520, 0.08); break;
      case 'die': beep(150, 0.2, 'sawtooth'); setTimeout(()=>beep(100,0.3,'sawtooth'),150); break;
      case 'level': beep(400,0.1); setTimeout(()=>beep(500,0.1),100); setTimeout(()=>beep(600,0.15),200); break;
      case 'select': beep(300, 0.05); break;
      case 'start': beep(350,0.08); setTimeout(()=>beep(450,0.1),90); break;
      case 'eat': beep(600, 0.07); break;
      case 'shoot': beep(800, 0.04, 'square', 0.06); break;
      case 'hit': beep(200, 0.08, 'triangle'); break;
    }
  }

  // ========== CANVAS / RENDER ==========
  const COLS = 10, ROWS = 20;
  const boardCanvas = document.getElementById('board');
  const nextCanvas = document.getElementById('next');
  const bctx = boardCanvas.getContext('2d');
  const nctx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const hiscoreEl = document.getElementById('hiscore');
  const sideLabel1 = document.getElementById('sideLabel1');
  const sideLabel2 = document.getElementById('sideLabel2');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayTiny = document.getElementById('overlayTiny');

  let cellSize = 0;
  let pixelOn, pixelOff;

  function refreshColors(){
    const s = getComputedStyle(document.documentElement);
    pixelOn = s.getPropertyValue('--pixel-on').trim();
    pixelOff = s.getPropertyValue('--pixel-off').trim();
  }

  function applyGreenScreen(on){
    const root = document.documentElement;
    if (on) {
      // Pure classic green LCD look
      root.style.setProperty('--screen-bg',  '#8fbc8f');
      root.style.setProperty('--screen-bg2', '#7aab7a');
      root.style.setProperty('--pixel-on',   '#0d1f0d');
      root.style.setProperty('--pixel-off',  '#6a9a6a');
      root.style.setProperty('--shell',      '#c9c3b3');
      root.style.setProperty('--shell-dark', '#a89f8a');
    } else {
      // Original beige/olive look
      root.style.setProperty('--screen-bg',  '#9db89a');
      root.style.setProperty('--screen-bg2', '#93af8f');
      root.style.setProperty('--pixel-on',   '#2b3a2c');
      root.style.setProperty('--pixel-off',  '#7f9d7d');
      root.style.setProperty('--shell',      '#c9c3b3');
      root.style.setProperty('--shell-dark', '#a89f8a');
    }
    refreshColors();
    // force redraw of current screen
    if (state === 'menu') drawMenu();
    else if (state === 'level') drawLevelSelect();
    else if (state === 'settings') drawSettings();
    else if (state === 'play' && G && G.draw) G.draw();
  }
  refreshColors();
  // apply saved green screen preference on boot
  if (greenScreen) applyGreenScreen(true);

  function resizeCanvas(){
    const wrap = boardCanvas.parentElement;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const size = Math.floor(Math.min(w / COLS, h / ROWS));
    cellSize = Math.max(8, size);
    boardCanvas.width = cellSize * COLS;
    boardCanvas.height = cellSize * ROWS;
    if (G && G.draw) G.draw();
  }

  function clearBoard(bgAlpha=1){
    bctx.clearRect(0,0,boardCanvas.width, boardCanvas.height);
    // faint LCD off-pixels
    bctx.globalAlpha = 0.32 * bgAlpha;
    bctx.fillStyle = pixelOff;
    const pad = Math.max(1, cellSize*0.08);
    for (let r=0;r<ROWS;r++){
      for (let c=0;c<COLS;c++){
        bctx.fillRect(c*cellSize+pad, r*cellSize+pad, cellSize-pad*2, cellSize-pad*2);
      }
    }
    bctx.globalAlpha = 1;
  }

  function drawCell(x, y, on=true, alpha=1){
    if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;
    const pad = Math.max(1, cellSize*0.08);
    bctx.globalAlpha = alpha;
    bctx.fillStyle = on ? pixelOn : 'transparent';
    bctx.fillRect(x*cellSize+pad, y*cellSize+pad, cellSize-pad*2, cellSize-pad*2);
    bctx.globalAlpha = 1;
  }

  function drawRect(x, y, w, h, on=true){
    for (let dy=0; dy<h; dy++)
      for (let dx=0; dx<w; dx++)
        drawCell(x+dx, y+dy, on);
  }

  function drawGhostCell(x, y){
    if (y < 0) return;
    const pad = Math.max(1, cellSize*0.08);
    bctx.save();
    bctx.strokeStyle = pixelOn;
    bctx.lineWidth = Math.max(1, cellSize*0.09);
    bctx.globalAlpha = 0.55;
    bctx.strokeRect(x*cellSize+pad+bctx.lineWidth/2, y*cellSize+pad+bctx.lineWidth/2,
                    cellSize-pad*2-bctx.lineWidth, cellSize-pad*2-bctx.lineWidth);
    bctx.restore();
  }

  // ========== HI-SCORES ==========
  function loadHi(mode){ return parseInt(localStorage.getItem('bg_hi_'+mode) || '0', 10); }
  function saveHi(mode, score){
    const cur = loadHi(mode);
    if (score > cur){ localStorage.setItem('bg_hi_'+mode, score); return score; }
    return cur;
  }

  // ========== GAME STATE MACHINE ==========
  const MODES = [
    { id:'A', name:'BRICK',   desc:'Classic Tetris' },
    { id:'B', name:'BRICK B', desc:'Tetris + Garbage' },
    { id:'C', name:'RACE',    desc:'Dodge the cars' },
    { id:'D', name:'SNAKE',   desc:'Eat & grow' },
    { id:'E', name:'SHOOT',   desc:'Clear the blocks' },
    { id:'F', name:'TANK',    desc:'Battle City lite' },
    { id:'G', name:'BREAK',   desc:'Breakout' },
    { id:'H', name:'FROG',    desc:'Cross the road' }
  ];

  let state = 'menu'; // menu | level | play | pause | over | settings
  let menuIndex = 0;
  let levelSelect = 1;
  let speedSelect = 1;
  let settingsIndex = 0; // 0 = Slide Mode
  let currentMode = null;
  let G = null; // current game instance
  let hiscore = 0;
  let animId = null;
  let lastTs = 0;
  let prevStateBeforeSettings = 'menu';

  function showOverlay(title, sub, tiny){
    overlayTitle.textContent = title || '';
    overlaySub.innerHTML = sub || '';
    overlayTiny.textContent = tiny || '';
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  function updateHUD(score, level, hi, label1='NEXT', label2='HI'){
    scoreEl.textContent = score;
    levelEl.textContent = level;
    hiscoreEl.textContent = hi;
    sideLabel1.textContent = label1;
    sideLabel2.textContent = label2;
  }

  // ========== MENU ==========
  function drawMenu(){
    clearBoard();
    hideOverlay();
    const lines = [
      ' ' + t('selectGame'),
      '',
    ];
    MODES.forEach((m,i)=>{
      const prefix = (i===menuIndex) ? '>' : ' ';
      lines.push(`${prefix}${m.id} ${m.name}`);
    });
    lines.push('');
    lines.push(' ' + t('move'));
    lines.push(' ' + t('startOk'));

    bctx.fillStyle = pixelOn;
    bctx.font = `${Math.floor(cellSize*1.1)}px VT323, monospace`;
    bctx.textAlign = 'left';
    bctx.textBaseline = 'top';
    const startY = cellSize * 0.7;
    lines.forEach((ln,i)=>{
      if (i >= 2 && i < 2 + MODES.length && (i-2) === menuIndex) {
        bctx.fillStyle = pixelOn;
        bctx.fillRect(cellSize*0.2, startY + i*(cellSize*0.92) - 1, cellSize*9.2, cellSize*0.88);
        bctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--screen-bg').trim() || '#9db89a';
      } else {
        bctx.fillStyle = pixelOn;
      }
      bctx.fillText(ln, cellSize*0.35, startY + i*(cellSize*0.92));
    });

    nctx.clearRect(0,0,nextCanvas.width, nextCanvas.height);
    updateHUD(0, levelSelect, loadHi(MODES[menuIndex].id), t('mode'), t('hi'));
  }

  function drawLevelSelect(){

  // ========== INPUT ==========
  const keys = {};
  function bindHoldable(el, downFn, upFn){
    let delayT=null, repT=null;
    const start = (e)=>{
      e.preventDefault();
      if (delayT||repT) return;
      el.classList.add('active-press');
      downFn();
      // classic hold-to-repeat (separate from touch-drag SLIDE)
      if (holdRepeat) {
        delayT = setTimeout(()=>{ repT = setInterval(downFn, 55); }, 220);
      }
    };
    const stop = (e)=>{
      if(e) e.preventDefault();
      el.classList.remove('active-press');
      clearTimeout(delayT); delayT=null;
      clearInterval(repT); repT=null;
      if (upFn) upFn();
    };
    el.addEventListener('touchstart', start, {passive:false});
    el.addEventListener('touchend', stop, {passive:false});
    el.addEventListener('touchcancel', stop, {passive:false});
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', stop);
    el.addEventListener('mouseleave', stop);
  }
  function bindTap(el, fn){
    const h = (e)=>{ e.preventDefault(); fn(); };
    el.addEventListener('touchstart', h, {passive:false});
    el.addEventListener('click', h);
  }

  // ========== TETRIS (A & B) ==========
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const KEYS = Object.keys(SHAPES);

  function makeTetris(isB){
    const COMBO_MSGS = {
      en: {2:'GOOD!', 3:'GREAT!', 4:'EXCELLENT!', 5:'AMAZING!', 6:'UNREAL!', 7:'GODLIKE!', 8:'LEGENDARY!'},
      el: {2:'ΚΑΛΑ!', 3:'ΤΕΛΕΙΑ!', 4:'ΕΞΑΙΡΕΤΙΚΑ!', 5:'ΑΠΙΣΤΕΥΤΟ!', 6:'ΘΕΙΚΟ!', 7:'ΘΡΥΛΙΚΟ!', 8:'ΘΕΟΣ!'}
    };
    const TETRIS_MSGS = {
      en: {1:'TETRIS!', 2:'DOUBLE TETRIS!', 3:'TRIPLE TETRIS!', 4:'QUAD TETRIS!', 5:'PENTA TETRIS!'},
      el: {1:'ΤΕΤΡΙΣ!', 2:'ΔΙΠΛΟ ΤΕΤΡΙΣ!', 3:'ΤΡΙΠΛΟ ΤΕΤΡΙΣ!', 4:'ΤΕΤΡΑΠΛΟ!', 5:'ΠΕΝΤΑΠΛΟ!'}
    };
    return {
      grid: null, cur: null, curType: null, curRot: 0, nextType: null,
      score: 0, level: 1, lines: 0, dropInterval: 800, dropAcc: 0,
      gameOver: false,
      combo: 0, tetrisStreak: 0,
      splash: null, splashTimer: 0,
      init(){
        this.grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
        this.score=0; this.lines=0;
        this.level = levelSelect;
        this.dropInterval = Math.max(120, 900 - (speedSelect-1)*55 - (this.level-1)*35);
        this.dropAcc=0; this.gameOver=false;
        this.combo=0; this.tetrisStreak=0;
        this.splash=null; this.splashTimer=0;
        if (isB){
          const garbage = Math.min(12, 2 + levelSelect*2);
          for (let r=ROWS-garbage; r<ROWS; r++){
            for (let c=0;c<COLS;c++) if (Math.random()>0.35) this.grid[r][c]='X';
            this.grid[r][Math.floor(Math.random()*COLS)] = 0;
          }
        }
        this.nextType = KEYS[Math.floor(Math.random()*KEYS.length)];
        this.spawn();
        updateHUD(this.score, this.level, hiscore, t('next'), t('hi'));
        this.drawNext();
      },
      showSplash(text, ms=1100){
        this.splash = text;
        this.splashTimer = ms;
      },
      spawn(){
        this.curType = this.nextType;
        this.nextType = KEYS[Math.floor(Math.random()*KEYS.length)];
        this.curRot = 0;
        const base = SHAPES[this.curType];
        this.cur = base.map(([x,y])=>({x:x+3, y:y}));
        if (this.collides(this.cur)) this.die();
        this.drawNext();
      },
      collides(pts){
        for (const p of pts){
          if (p.x<0||p.x>=COLS||p.y>=ROWS) return true;
          if (p.y>=0 && this.grid[p.y][p.x]) return true;
        }
        return false;
      },
      rotate(){
        const newRot = (this.curRot + 1) % 4;
        // rotate shape in its local 4x4 box
        let local = SHAPES[this.curType].map(pt => pt.slice());
        for (let t = 0; t < newRot; t++) local = local.map(([x, y]) => [3 - y, x]);
        // previous local shape at current rotation
        let prevLocal = SHAPES[this.curType].map(pt => pt.slice());
        for (let t = 0; t < this.curRot; t++) prevLocal = prevLocal.map(([x, y]) => [3 - y, x]);
        // infer pivot = current piece position minus previous local coords
        // use the first block as anchor to avoid drift
        const anchorCur = this.cur[0];
        const anchorPrev = prevLocal[0];
        const baseX = anchorCur.x - anchorPrev[0];
        const baseY = anchorCur.y - anchorPrev[1];
        // wall kicks: try no offset, then left, right, up, 2left, 2right
        const kicks = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,-2],[-1,-1],[1,-1]];
        for (const [kx, ky] of kicks) {
          const cand = local.map(([x, y]) => ({ x: baseX + x + kx, y: baseY + y + ky }));
          if (!this.collides(cand)) {
            this.cur = cand;
            this.curRot = newRot;
            sfx('rotate');
            return;
          }
        }
      },
      move(dx,dy){
        const moved = this.cur.map(p=>({x:p.x+dx,y:p.y+dy}));
        if (!this.collides(moved)){ this.cur=moved; return true; }
        return false;
      },
      hardDrop(){
        let d=0;
        while(this.move(0,1)) d++;
        this.lock();
        sfx('drop');
      },
      lock(){
        for (const p of this.cur) if (p.y>=0) this.grid[p.y][p.x]=this.curType;
        sfx('lock');
        this.clearLines();
        this.spawn();
      },
      clearLines(){
        let cleared=0;
        for (let r=ROWS-1;r>=0;r--){
          if (this.grid[r].every(c=>c)){
            this.grid.splice(r,1);
            this.grid.unshift(Array(COLS).fill(0));
            cleared++; r++;
          }
        }
        if (cleared){
          // combo: consecutive line-clearing pieces
          this.combo++;
          const pts = [0,40,100,300,1200][cleared]*this.level;
          // combo bonus
          const comboBonus = this.combo >= 2 ? (this.combo - 1) * 50 * this.level : 0;
          this.score += pts + comboBonus;
          this.lines += cleared;
          const newLev = Math.floor(this.lines/10)+levelSelect;
          if (newLev > this.level){ this.level=newLev; sfx('level'); this.dropInterval=Math.max(80,this.dropInterval-40); }
          else sfx('line');

          // tetris streak (4-line clears)
          if (cleared === 4) {
            this.tetrisStreak++;
            const tMsgs = TETRIS_MSGS[lang] || TETRIS_MSGS.en;
            const tKey = Math.min(this.tetrisStreak, 5);
            this.showSplash(tMsgs[tKey] || tMsgs[5], 1300);
            sfx('level');
          } else {
            this.tetrisStreak = 0;
            // combo splash from 2nd consecutive clear
            if (this.combo >= 2) {
              const cMsgs = COMBO_MSGS[lang] || COMBO_MSGS.en;
              const cKey = Math.min(this.combo, 8);
              const msg = cMsgs[cKey] || cMsgs[8];
              this.showSplash(this.combo + 'x ' + msg, 1000);
            }
          }

          hiscore = saveHi(currentMode.id, this.score);
          updateHUD(this.score, this.level, hiscore, t('next'), t('hi'));
        } else {
          // locked piece with no lines → reset combos
          this.combo = 0;
          this.tetrisStreak = 0;
        }
      },
      die(){
        this.gameOver=true;
        sfx('die');
        state='over';
        showOverlay(t('gameOver'), t('score') + ' ' + this.score, t('pressReset'));
      },
      update(dt){
        if (this.gameOver) return;
        this.dropAcc += dt;
        if (this.dropAcc >= this.dropInterval){
          this.dropAcc=0;
          if (!this.move(0,1)) this.lock();
        }
        if (this.splashTimer > 0) {
          this.splashTimer -= dt;
          if (this.splashTimer <= 0) { this.splash = null; this.splashTimer = 0; }
        }
      },
      draw(){
        clearBoard();
        // locked
        for (let r=0;r<ROWS;r++)
          for (let c=0;c<COLS;c++)
            if (this.grid[r][c]) drawCell(c,r,true);
        // ghost (if enabled)
        if (this.cur){
          if (ghostOn) {
            let off=0;
            while(!this.collides(this.cur.map(p=>({x:p.x,y:p.y+off+1})))) off++;
            this.cur.forEach(p=>drawGhostCell(p.x, p.y+off));
          }
          this.cur.forEach(p=>drawCell(p.x,p.y,true));
        }
        // combo / tetris splash in center of board
        if (this.splash && this.splashTimer > 0) {
          const alpha = Math.min(1, this.splashTimer / 200);
          bctx.save();
          bctx.globalAlpha = alpha;
          bctx.fillStyle = pixelOn;
          const fontSize = Math.max(12, Math.floor(cellSize * 1.3));
          bctx.font = `bold ${fontSize}px VT323, monospace`;
          bctx.textAlign = 'center';
          bctx.textBaseline = 'middle';
          // dark backing box
          const tw = bctx.measureText(this.splash).width;
          const bx = boardCanvas.width / 2;
          const by = boardCanvas.height / 2;
          bctx.fillStyle = pixelOff;
          bctx.globalAlpha = alpha * 0.85;
          bctx.fillRect(bx - tw/2 - 6, by - fontSize/2 - 4, tw + 12, fontSize + 8);
          bctx.globalAlpha = alpha;
          bctx.fillStyle = pixelOn;
          bctx.fillText(this.splash, bx, by);
          // small combo counter under splash if combo >= 2 and not tetris msg
          if (this.combo >= 2 && this.tetrisStreak === 0) {
            bctx.font = `${Math.floor(fontSize*0.7)}px VT323, monospace`;
            bctx.fillText('COMBO x' + this.combo, bx, by + fontSize * 0.9);
          }
          bctx.restore();
        }
      },
      drawNext(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        const pts = SHAPES[this.nextType];
        const size=11;
        const offX=(nextCanvas.width-4*size)/2;
        const offY=(nextCanvas.height-2*size)/2;
        nctx.fillStyle=pixelOn;
        pts.forEach(([x,y])=>{
          nctx.fillRect(offX+x*size+1, offY+y*size+1, size-2, size-2);
        });
      },
      onLeft(){ if(this.move(-1,0)) sfx('move'); },
      onRight(){ if(this.move(1,0)) sfx('move'); },
      onDown(){ if(!this.move(0,1)) this.lock(); else sfx('move'); },
      onUp(){ this.rotate(); },
      onA(){ this.rotate(); },
      onB(){ this.hardDrop(); }
    };
  }

  // ========== RACE (C) ==========
  function makeRace(){
    return {
      playerLane: 1, // 0 1 2
      cars: [], score:0, level:1, speed:0, acc:0, spawnAcc:0, gameOver:false,
      lanes: [2, 4, 6], // x positions
      init(){
        this.playerLane=1; this.cars=[]; this.score=0;
        this.level=levelSelect; this.speed = 0.55 + (speedSelect-1)*0.12 + (levelSelect-1)*0.06;
        this.acc=0; this.spawnAcc=0; this.gameOver=false;
        updateHUD(this.score, this.level, hiscore, 'CARS', 'HI');
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
      },
      spawnCar(){
        const lane = Math.floor(Math.random()*3);
        // avoid instant collision
        if (this.cars.some(c=>c.lane===lane && c.y < 4)) return;
        this.cars.push({lane, y: -3, w:2, h:3});
      },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt;
        this.spawnAcc += dt;
        const step = this.speed * (dt/16);
        this.cars.forEach(c=> c.y += step);
        // remove offscreen + score
        this.cars = this.cars.filter(c=>{
          if (c.y > ROWS){ this.score += 10; hiscore=saveHi('C',this.score); updateHUD(this.score,this.level,hiscore,'CARS','HI'); sfx('score'); return false; }
          return true;
        });
        // spawn
        const spawnRate = Math.max(700, 1800 - this.level*60 - speedSelect*40);
        if (this.spawnAcc > spawnRate){ this.spawnAcc=0; this.spawnCar(); }
        // level up
        if (this.score > 0 && this.score % 200 === 0 && this.score/200 >= this.level){
          this.level++; this.speed += 0.08; sfx('level');
          updateHUD(this.score,this.level,hiscore,'CARS','HI');
        }
        // collision
        const px = this.lanes[this.playerLane];
        const py = ROWS-4;
        for (const c of this.cars){
          const cx = this.lanes[c.lane];
          if (Math.abs(cx-px)<2 && c.y+c.h > py && c.y < py+3){
            this.die(); break;
          }
        }
      },
      die(){
        this.gameOver=true; sfx('die'); state='over';
        showOverlay(t('crash'), t('score') + ' ' + this.score, t('pressReset'));
      },
      draw(){
        clearBoard();
        // road lines
        bctx.globalAlpha=0.4;
        for (let y=0;y<ROWS;y++){
          if (Math.floor(y/2)%2===0){
            drawCell(3,y,true,0.5);
            drawCell(5,y,true,0.5);
            drawCell(7,y,true,0.5);
          }
        }
        bctx.globalAlpha=1;
        // player car
        const px = this.lanes[this.playerLane];
        const py = ROWS-4;
        drawRect(px, py, 2, 3, true);
        // enemy cars
        this.cars.forEach(c=>{
          const cx = this.lanes[c.lane];
          drawRect(cx, Math.floor(c.y), 2, 3, true);
        });
      },
      onLeft(){ if(this.playerLane>0){ this.playerLane--; sfx('move'); } },
      onRight(){ if(this.playerLane<2){ this.playerLane++; sfx('move'); } },
      onDown(){}, onUp(){}, onA(){}, onB(){}
    };
  }

  // ========== SNAKE (D) ==========
  function makeSnake(){
    return {
      body: [], dir: {x:1,y:0}, nextDir: {x:1,y:0}, food: null,
      score:0, level:1, moveAcc:0, moveInterval:180, gameOver:false, grow:0,
      init(){
        this.body = [{x:4,y:10},{x:3,y:10},{x:2,y:10}];
        this.dir={x:1,y:0}; this.nextDir={x:1,y:0};
        this.score=0; this.level=levelSelect;
        this.moveInterval = Math.max(90, 280 - (speedSelect-1)*15 - (levelSelect-1)*10);
        this.moveAcc=0; this.gameOver=false; this.grow=0;
        this.placeFood();
        updateHUD(this.score, this.level, hiscore, 'FOOD', 'HI');
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
      },
      placeFood(){
        let tries=0;
        do {
          this.food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)};
          tries++;
        } while (this.body.some(b=>b.x===this.food.x&&b.y===this.food.y) && tries<100);
      },
      update(dt){
        if (this.gameOver) return;
        this.moveAcc += dt;
        if (this.moveAcc >= this.moveInterval){
          this.moveAcc=0;
          this.dir = {...this.nextDir};
          const head = this.body[0];
          const nh = {x: head.x+this.dir.x, y: head.y+this.dir.y};
          // wall / self
          if (nh.x<0||nh.x>=COLS||nh.y<0||nh.y>=ROWS || this.body.some(b=>b.x===nh.x&&b.y===nh.y)){
            this.die(); return;
          }
          this.body.unshift(nh);
          if (nh.x===this.food.x && nh.y===this.food.y){
            this.score += 10;
            this.grow += 1;
            sfx('eat');
            hiscore = saveHi('D', this.score);
            if (this.score % 50 === 0){ this.level++; this.moveInterval=Math.max(80,this.moveInterval-10); sfx('level'); }
            updateHUD(this.score, this.level, hiscore, 'FOOD', 'HI');
            this.placeFood();
          } else if (this.grow>0){ this.grow--; }
          else this.body.pop();
        }
      },
      die(){
        this.gameOver=true; sfx('die'); state='over';
        showOverlay(t('gameOver'), t('score') + ' ' + this.score, t('pressReset'));
      },
      draw(){
        clearBoard();
        this.body.forEach((b,i)=> drawCell(b.x, b.y, true, i===0?1:0.85));
        if (this.food) drawCell(this.food.x, this.food.y, true);
      },
      setDir(dx,dy){
        // prevent reverse
        if (this.dir.x + dx === 0 && this.dir.y + dy === 0) return;
        this.nextDir = {x:dx, y:dy};
      },
      onLeft(){ this.setDir(-1,0); sfx('move'); },
      onRight(){ this.setDir(1,0); sfx('move'); },
      onUp(){ this.setDir(0,-1); sfx('move'); },
      onDown(){ this.setDir(0,1); sfx('move'); },
      onA(){}, onB(){}
    };
  }

  // ========== SHOOT (E) ==========
  function makeShoot(){
    return {
      playerX: 4, bullets: [], enemies: [], score:0, level:1,
      acc:0, spawnAcc:0, gameOver:false, lives:3,
      init(){
        this.playerX=4; this.bullets=[]; this.enemies=[];
        this.score=0; this.level=levelSelect; this.lives=3;
        this.acc=0; this.spawnAcc=0; this.gameOver=false;
        this.spawnWave();
        updateHUD(this.score, this.level, hiscore, 'LIVE', 'HI');
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn;
        nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      spawnWave(){
        const rows = Math.min(4, 1+Math.floor(this.level/2));
        for (let r=0;r<rows;r++){
          for (let c=0;c<8;c++){
            if (Math.random()>0.3) this.enemies.push({x:c+1, y:r+1, hp:1});
          }
        }
      },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt; this.spawnAcc += dt;
        // move bullets
        this.bullets.forEach(b=> b.y -= 0.18*(dt/16)*(1+speedSelect*0.06));
        this.bullets = this.bullets.filter(b=>b.y > -1);
        // enemy descend slowly
        if (this.spawnAcc > Math.max(1200, 3200 - this.level*120 - speedSelect*80)){
          this.spawnAcc=0;
          this.enemies.forEach(e=> e.y += 1);
          // check bottom
          if (this.enemies.some(e=>e.y >= ROWS-2)){ this.hit(); }
        }
        // collisions bullet-enemy
        for (let i=this.bullets.length-1;i>=0;i--){
          const b=this.bullets[i];
          for (let j=this.enemies.length-1;j>=0;j--){
            const e=this.enemies[j];
            if (Math.abs(b.x-e.x)<1 && Math.abs(b.y-e.y)<1){
              this.enemies.splice(j,1);
              this.bullets.splice(i,1);
              this.score += 20;
              sfx('hit');
              hiscore=saveHi('E',this.score);
              updateHUD(this.score,this.level,hiscore,'LIVE','HI');
              break;
            }
          }
        }
        if (this.enemies.length===0){
          this.level++; sfx('level');
          updateHUD(this.score,this.level,hiscore,'LIVE','HI');
          this.spawnWave();
        }
      },
      hit(){
        this.lives--;
        this.drawSide();
        sfx('die');
        this.enemies = this.enemies.filter(e=>e.y < ROWS-3);
        if (this.lives<=0){
          this.gameOver=true; state='over';
          showOverlay(t('gameOver'), t('score') + ' ' + this.score, t('pressReset'));
        }
      },
      shoot(){
        if (this.bullets.length < 3){
          this.bullets.push({x:this.playerX, y:ROWS-3});
          sfx('shoot');
        }
      },
      draw(){
        clearBoard();
        // player
        drawRect(this.playerX, ROWS-2, 1, 2, true);
        // bullets
        this.bullets.forEach(b=> drawCell(Math.floor(b.x), Math.floor(b.y), true));
        // enemies
        this.enemies.forEach(e=> drawCell(e.x, Math.floor(e.y), true));
      },
      onLeft(){ if(this.playerX>0){ this.playerX--; sfx('move'); } },
      onRight(){ if(this.playerX<COLS-1){ this.playerX++; sfx('move'); } },
      onDown(){}, onUp(){ this.shoot(); },
      onA(){ this.shoot(); }, onB(){ this.shoot(); }
    };
  }

  // ========== TANK (F) ==========
  function makeTank(){
    return {
      px:4, py:16, pDir:0, // 0u 1r 2d 3l
      bullets: [], enemies: [], score:0, level:1, lives:3,
      acc:0, eAcc:0, gameOver:false, spawnCD:0,
      dirs: [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}],
      init(){
        this.px=4; this.py=16; this.pDir=0;
        this.bullets=[]; this.enemies=[]; this.score=0;
        this.level=levelSelect; this.lives=3;
        this.acc=0; this.eAcc=0; this.gameOver=false; this.spawnCD=0;
        this.spawnEnemy();
        updateHUD(this.score, this.level, hiscore, 'LIVE', 'HI');
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn; nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      spawnEnemy(){
        if (this.enemies.length >= 3+Math.floor(this.level/2)) return;
        const side = Math.floor(Math.random()*3);
        let x,y;
        if (side===0){ x=Math.floor(Math.random()*COLS); y=0; }
        else if (side===1){ x=0; y=Math.floor(Math.random()*8); }
        else { x=COLS-1; y=Math.floor(Math.random()*8); }
        this.enemies.push({x, y, dir:Math.floor(Math.random()*4), moveCD:0, shootCD:40+Math.random()*60});
      },
      update(dt){
        if (this.gameOver) return;
        this.acc += dt; this.eAcc += dt; this.spawnCD += dt;
        // player bullets
        this.bullets.forEach(b=>{
          b.x += this.dirs[b.dir].x * 0.22*(dt/16);
          b.y += this.dirs[b.dir].y * 0.22*(dt/16);
        });
        this.bullets = this.bullets.filter(b=>b.x>=-1&&b.x<COLS+1&&b.y>=-1&&b.y<ROWS+1);
        // enemies AI
        if (this.eAcc > Math.max(160, 380 - this.level*12 - speedSelect*15)){
          this.eAcc=0;
          this.enemies.forEach(e=>{
            e.moveCD--; e.shootCD--;
            if (e.moveCD<=0){
              if (Math.random()<0.3) e.dir = Math.floor(Math.random()*4);
              const nx=e.x+this.dirs[e.dir].x, ny=e.y+this.dirs[e.dir].y;
              if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS-3) { e.x=nx; e.y=ny; }
              else e.dir = Math.floor(Math.random()*4);
              e.moveCD=3+Math.floor(Math.random()*4);
            }
            if (e.shootCD<=0){
              this.bullets.push({x:e.x, y:e.y, dir:e.dir, enemy:true});
              e.shootCD=50+Math.random()*80;
            }
          });
        }
        // spawn more
        if (this.spawnCD > Math.max(1500, 4000-this.level*200)){ this.spawnCD=0; this.spawnEnemy(); }
        // collisions
        for (let i=this.bullets.length-1;i>=0;i--){
          const b=this.bullets[i];
          if (!b.enemy){
            for (let j=this.enemies.length-1;j>=0;j--){
              const e=this.enemies[j];
              if (Math.abs(b.x-e.x)<0.8 && Math.abs(b.y-e.y)<0.8){
                this.enemies.splice(j,1); this.bullets.splice(i,1);
                this.score+=50; sfx('hit');
                hiscore=saveHi('F',this.score);
                if (this.score%200===0){ this.level++; sfx('level'); }
                updateHUD(this.score,this.level,hiscore,'LIVE','HI');
                break;
              }
            }
          } else {
            if (Math.abs(b.x-this.px)<0.8 && Math.abs(b.y-this.py)<0.8){
              this.bullets.splice(i,1);
              this.lives--; this.drawSide(); sfx('die');
              if (this.lives<=0){ this.gameOver=true; state='over';
                showOverlay(t('gameOver'), t('score') + ' ' + this.score, t('pressReset')); }
            }
          }
        }
      },
      shoot(){
        if (this.bullets.filter(b=>!b.enemy).length < 2){
          this.bullets.push({x:this.px, y:this.py, dir:this.pDir, enemy:false});
          sfx('shoot');
        }
      },
      moveP(dx,dy){
        const nx=this.px+dx, ny=this.py+dy;
        if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){ this.px=nx; this.py=ny; sfx('move'); }
      },
      draw(){
        clearBoard();
        // base protection line
        for (let c=0;c<COLS;c++) drawCell(c, ROWS-1, true, 0.35);
        // player
        drawCell(this.px, this.py, true);
        // simple dir indicator
        const d=this.dirs[this.pDir];
        drawCell(this.px+d.x, this.py+d.y, true, 0.5);
        // enemies
        this.enemies.forEach(e=> drawCell(Math.floor(e.x), Math.floor(e.y), true));
        // bullets
        this.bullets.forEach(b=> drawCell(Math.floor(b.x), Math.floor(b.y), true));
      },
      onLeft(){ this.pDir=3; this.moveP(-1,0); },
      onRight(){ this.pDir=1; this.moveP(1,0); },
      onUp(){ this.pDir=0; this.moveP(0,-1); },
      onDown(){ this.pDir=2; this.moveP(0,1); },
      onA(){ this.shoot(); }, onB(){ this.shoot(); }
    };
  }

  // ========== BREAKOUT (G) ==========
  function makeBreak(){
    return {
      paddleX: 3, ballX:5, ballY:12, ballDX:0.12, ballDY:-0.12,
      bricks: [], score:0, level:1, lives:3, acc:0, gameOver:false, started:false,
      init(){
        this.paddleX=3; this.ballX=5; this.ballY=14;
        this.ballDX=0.07 + speedSelect*0.012; this.ballDY=-0.07 - speedSelect*0.012;
        this.score=0; this.level=levelSelect; this.lives=3;
        this.acc=0; this.gameOver=false; this.started=false;
        this.buildBricks();
        updateHUD(this.score, this.level, hiscore, 'LIVE', 'HI');
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn; nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      buildBricks(){
        this.bricks=[];
        const rows = Math.min(6, 2+this.level);
        for (let r=0;r<rows;r++)
          for (let c=0;c<COLS;c++)
            if (Math.random()>0.15) this.bricks.push({x:c, y:r+1, hp:1});
      },
      update(dt){
        if (this.gameOver || !this.started) return;
        const sp = 0.9 + this.level*0.08;
        this.ballX += this.ballDX * sp * (dt/16);
        this.ballY += this.ballDY * sp * (dt/16);
        // walls
        if (this.ballX < 0){ this.ballX=0; this.ballDX*=-1; sfx('hit'); }
        if (this.ballX > COLS-1){ this.ballX=COLS-1; this.ballDX*=-1; sfx('hit'); }
        if (this.ballY < 0){ this.ballY=0; this.ballDY*=-1; sfx('hit'); }
        // paddle
        if (this.ballY >= ROWS-3 && this.ballY < ROWS-1 &&
            this.ballX >= this.paddleX-0.5 && this.ballX <= this.paddleX+3.5){
          this.ballDY = -Math.abs(this.ballDY);
          const hitPos = (this.ballX - this.paddleX) / 3;
          this.ballDX = (hitPos - 0.5) * 0.22;
          sfx('hit');
        }
        // bottom
        if (this.ballY > ROWS){
          this.lives--; this.drawSide(); sfx('die');
          this.started=false;
          this.ballX = this.paddleX+1; this.ballY=14;
          this.ballDY=-Math.abs(this.ballDY);
          if (this.lives<=0){ this.gameOver=true; state='over';
            showOverlay(t('gameOver'), t('score') + ' ' + this.score, t('pressReset')); }
        }
        // bricks
        for (let i=this.bricks.length-1;i>=0;i--){
          const br=this.bricks[i];
          if (Math.abs(this.ballX-br.x)<0.8 && Math.abs(this.ballY-br.y)<0.8){
            this.bricks.splice(i,1);
            this.ballDY *= -1;
            this.score += 15;
            sfx('hit');
            hiscore=saveHi('G',this.score);
            updateHUD(this.score,this.level,hiscore,'LIVE','HI');
            break;
          }
        }
        if (this.bricks.length===0){
          this.level++; sfx('level');
          this.buildBricks();
          this.started=false;
          this.ballX=this.paddleX+1; this.ballY=14;
          updateHUD(this.score,this.level,hiscore,'LIVE','HI');
        }
      },
      draw(){
        clearBoard();
        // bricks
        this.bricks.forEach(br=> drawCell(br.x, br.y, true));
        // paddle
        drawRect(this.paddleX, ROWS-2, 3, 1, true);
        // ball
        drawCell(Math.floor(this.ballX), Math.floor(this.ballY), true);
      },
      onLeft(){ if(this.paddleX>0){ this.paddleX--; if(!this.started) this.ballX=this.paddleX+1; sfx('move'); } },
      onRight(){ if(this.paddleX<COLS-3){ this.paddleX++; if(!this.started) this.ballX=this.paddleX+1; sfx('move'); } },
      onDown(){}, onUp(){ if(!this.started){ this.started=true; sfx('start'); } },
      onA(){ if(!this.started){ this.started=true; sfx('start'); } },
      onB(){ if(!this.started){ this.started=true; sfx('start'); } }
    };
  }

  // ========== FROGGER (H) ==========
  function makeFrog(){
    return {
      fx:4, fy:18, score:0, level:1, lives:3, acc:0, gameOver:false,
      cars: [], logs: [], home: [false,false,false,false,false],
      init(){
        this.fx=4; this.fy=18; this.score=0; this.level=levelSelect;
        this.lives=3; this.acc=0; this.gameOver=false;
        this.home=[false,false,false,false,false];
        this.buildTraffic();
        updateHUD(this.score, this.level, hiscore, 'LIVE', 'HI');
        this.drawSide();
      },
      drawSide(){
        nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        nctx.fillStyle=pixelOn; nctx.font='16px VT323';
        nctx.fillText('♥'.repeat(this.lives), 8, 28);
      },
      buildTraffic(){
        this.cars=[]; this.logs=[];
        // cars rows 12-16
        for (let r=0;r<4;r++){
          const y = 15-r;
          const dir = r%2===0 ? 1 : -1;
          const sp = (0.035 + this.level*0.006 + speedSelect*0.005) * dir;
          for (let i=0;i<3;i++){
            this.cars.push({x: Math.random()*COLS, y, w:2, sp, dir});
          }
        }
        // logs rows 3-8
        for (let r=0;r<4;r++){
          const y = 7-r;
          const dir = r%2===0 ? -1 : 1;
          const sp = (0.03 + this.level*0.005 + speedSelect*0.004) * dir;
          for (let i=0;i<2;i++){
            this.logs.push({x: Math.random()*COLS, y, w:3, sp, dir});
          }
        }
      },
      update(dt){
        if (this.gameOver) return;
        const t = dt/16;
        this.cars.forEach(c=>{
          c.x += c.sp * t;
          if (c.dir>0 && c.x > COLS) c.x = -c.w;
          if (c.dir<0 && c.x < -c.w) c.x = COLS;
        });
        this.logs.forEach(l=>{
          l.x += l.sp * t;
          if (l.dir>0 && l.x > COLS) l.x = -l.w;
          if (l.dir<0 && l.x < -l.w) l.x = COLS;
        });
        // frog on log?
        if (this.fy >= 3 && this.fy <= 7){
          let onLog=false;
          for (const l of this.logs){
            if (this.fy===l.y && this.fx >= l.x-0.3 && this.fx <= l.x+l.w-0.3){
              this.fx += l.sp * t;
              onLog=true; break;
            }
          }
          if (!onLog || this.fx<0 || this.fx>=COLS) this.die();
        }
        // car collision
        if (this.fy >= 12 && this.fy <= 16){
          for (const c of this.cars){
            if (this.fy===c.y && this.fx >= c.x-0.3 && this.fx <= c.x+c.w-0.3){ this.die(); break; }
          }
        }
        // home
        if (this.fy <= 1){
          const slot = Math.floor(this.fx / 2);
          if (slot>=0 && slot<5 && !this.home[slot] && this.fx%2 < 1.5){
            this.home[slot]=true;
            this.score += 100;
            sfx('score');
            hiscore=saveHi('H',this.score);
            updateHUD(this.score,this.level,hiscore,'LIVE','HI');
            this.fx=4; this.fy=18;
            if (this.home.every(h=>h)){
              this.level++; sfx('level');
              this.home=[false,false,false,false,false];
              this.buildTraffic();
              updateHUD(this.score,this.level,hiscore,'LIVE','HI');
            }
          } else this.die();
        }
      },
      die(){
        this.lives--; this.drawSide(); sfx('die');
        this.fx=4; this.fy=18;
        if (this.lives<=0){
          this.gameOver=true; state='over';
          showOverlay(t('gameOver'), t('score') + ' ' + this.score, t('pressReset'));
        }
      },
      move(dx,dy){
        const nx=this.fx+dx, ny=this.fy+dy;
        if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){ this.fx=nx; this.fy=ny; sfx('move');
          if (dy<0) { this.score+=5; updateHUD(this.score,this.level,hiscore,'LIVE','HI'); }
        }
      },
      draw(){
        clearBoard();
        // water
        for (let y=2;y<=8;y++) for (let x=0;x<COLS;x++) drawCell(x,y,true,0.15);
        // road
        for (let y=12;y<=16;y++) for (let x=0;x<COLS;x++) drawCell(x,y,true,0.12);
        // homes
        for (let i=0;i<5;i++){
          if (this.home[i]) drawCell(i*2, 0, true);
          else drawCell(i*2, 0, true, 0.3);
        }
        // logs
        this.logs.forEach(l=> drawRect(Math.floor(l.x), l.y, l.w, 1, true));
        // cars
        this.cars.forEach(c=> drawRect(Math.floor(c.x), c.y, c.w, 1, true));
        // frog – flashing for visibility
        const flash = (Math.floor(performance.now() / 180) % 2) === 0;
        drawCell(Math.floor(this.fx), this.fy, true, flash ? 1 : 0.35);
      },
      onLeft(){ this.move(-1,0); },
      onRight(){ this.move(1,0); },
      onUp(){ this.move(0,-1); },
      onDown(){ this.move(0,1); },
      onA(){ this.move(0,-1); }, onB(){ this.move(0,-1); }
    };
  }

  // ========== FACTORY ==========
  function createGame(modeId){
    switch(modeId){
      case 'A': return makeTetris(false);
      case 'B': return makeTetris(true);
      case 'C': return makeRace();
      case 'D': return makeSnake();
      case 'E': return makeShoot();
      case 'F': return makeTank();
      case 'G': return makeBreak();
      case 'H': return makeFrog();
      default: return makeTetris(false);
    }
  }

  // ========== MAIN LOOP ==========
  function loop(ts){
    if (!lastTs) lastTs=ts;
    const dt = Math.min(50, ts-lastTs);
    lastTs=ts;
    if (state==='play' && G){
      G.update(dt);
      G.draw();
    } else if (state==='menu') drawMenu();
    else if (state==='level') drawLevelSelect();
    else if (state==='settings') drawSettings();
    // keep button layout in sync (big L/R only while playing)
    applyBigLayout();
    animId = requestAnimationFrame(loop);
  }

  // ========== CONTROLS DISPATCH ==========
  function handleDir(dir){
    if (state==='menu'){
      if (dir==='up'){ menuIndex = (menuIndex-1+MODES.length)%MODES.length; sfx('select'); drawMenu(); }
      if (dir==='down'){ menuIndex = (menuIndex+1)%MODES.length; sfx('select'); drawMenu(); }
      return;
    }
    if (state==='level'){
      if (dir==='left'){ levelSelect=Math.max(1,levelSelect-1); sfx('select'); drawLevelSelect(); }
      if (dir==='right'){ levelSelect=Math.min(9,levelSelect+1); sfx('select'); drawLevelSelect(); }
      if (dir==='up'){ speedSelect=Math.min(9,speedSelect+1); sfx('select'); drawLevelSelect(); }
      if (dir==='down'){ speedSelect=Math.max(1,speedSelect-1); sfx('select'); drawLevelSelect(); }
      return;
    }
    if (state==='settings'){
      if (dir==='up'){ settingsIndex = (settingsIndex - 1 + SETTINGS_OPTS.length) % SETTINGS_OPTS.length; sfx('select'); drawSettings(); }
      if (dir==='down'){ settingsIndex = (settingsIndex + 1) % SETTINGS_OPTS.length; sfx('select'); drawSettings(); }
      if (dir==='left' || dir==='right'){
        const opt = SETTINGS_OPTS[settingsIndex];
        opt.set(!opt.get());
        sfx('select');
        drawSettings();
      }
      return;
    }
    if (state==='play' && G){
      if (dir==='left') G.onLeft();
      if (dir==='right') G.onRight();
      if (dir==='up') G.onUp();
      if (dir==='down') G.onDown();
      G.draw();
    }
  }
  function handleA(){
    if (state==='menu'){ hideOverlay(); state='level'; sfx('select'); drawLevelSelect(); return; }
    if (state==='level'){ startPlay(); return; }
    if (state==='settings'){ closeSettings(); return; }
    if (state==='play' && G){ G.onA(); G.draw(); }
    if (state==='over' || state==='pause') startPlay();
  }
  function handleB(){
    if (state==='play' && G){ G.onB(); G.draw(); }
    if (state==='menu' || state==='level') handleA();
    if (state==='settings'){ closeSettings(); }
  }
  function togglePause(){
    if (state==='play'){
      state='pause';
      applyBigLayout();
      showOverlay(t('paused'), MODES[menuIndex].name, t('resume'));
    } else if (state==='pause'){
      state='play'; hideOverlay(); lastTs=performance.now();
      applyBigLayout();
    } else if (state==='menu'){
      hideOverlay();
      state='level'; sfx('select'); drawLevelSelect();
      applyBigLayout();
    } else if (state==='level'){
      startPlay();
    } else if (state==='settings'){
      closeSettings();
    } else if (state==='over'){
      startPlay();
    }
  }
  function startPlay(){
    currentMode = MODES[menuIndex];
    hiscore = loadHi(currentMode.id);
    G = createGame(currentMode.id);
    G.init();
    state='play';
    hideOverlay();
    applyBigLayout();
    sfx('start');
    lastTs = performance.now();
  }
  function openSettings(){
    if (state === 'play' || state === 'pause') return; // don't open during game
    prevStateBeforeSettings = state;
    state = 'settings';
    settingsIndex = 0;
    hideOverlay();
    applyBigLayout();
    sfx('select');
    drawSettings();
  }
  function closeSettings(){
    state = prevStateBeforeSettings || 'menu';
    sfx('select');
    applyBigLayout();
    if (state === 'menu') drawMenu();
    else if (state === 'level') drawLevelSelect();
    else drawMenu();
  }
  function doReset(){
    state='menu';
    G=null;
    hideOverlay();
    applyBigLayout();
    levelSelect = 1;
    speedSelect = 1;
    menuIndex = 0;
    drawMenu();
  }

  // bind buttons
  bindHoldable(document.getElementById('btnLeft'), ()=>handleDir('left'));
  bindHoldable(document.getElementById('btnRight'), ()=>handleDir('right'));
  bindHoldable(document.getElementById('btnUp'), ()=>handleDir('up'));
  bindHoldable(document.getElementById('btnDown'), ()=>handleDir('down'));
  bindTap(document.getElementById('btnA'), handleA);
  bindTap(document.getElementById('btnB'), handleB);
  bindTap(document.getElementById('btnStart'), togglePause);
  bindTap(document.getElementById('btnReset'), doReset);
  bindTap(document.getElementById('btnSettings'), openSettings);
  bindTap(document.getElementById('btnSound'), ()=>{
    soundOn = !soundOn;
    localStorage.setItem('bg_sound', soundOn ? '1' : '0');
    document.getElementById('btnSound').textContent = soundOn ? 'SOUND' : 'MUTE';
    sfx('select');
  });
  // reflect saved sound state on boot
  document.getElementById('btnSound').textContent = soundOn ? 'SOUND' : 'MUTE';

  document.addEventListener('keydown', (e)=>{
    if (audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    switch(e.key){
      case 'ArrowLeft': case 'a': case 'A': handleDir('left'); break;
      case 'ArrowRight': case 'd': case 'D': handleDir('right'); break;
      case 'ArrowUp': case 'w': case 'W': handleDir('up'); break;
      case 'ArrowDown': case 's': case 'S': handleDir('down'); break;
      case ' ': case 'Enter': togglePause(); break;
      case 'z': case 'Z': case 'j': case 'J': handleA(); break;
      case 'x': case 'X': case 'k': case 'K': handleB(); break;
      case 'r': case 'R': doReset(); break;
      case 'm': case 'M':
        soundOn=!soundOn;
        localStorage.setItem('bg_sound', soundOn ? '1' : '0');
        document.getElementById('btnSound').textContent = soundOn ? 'SOUND' : 'MUTE';
        break;
      case 'o': case 'O': case ',':
        openSettings(); break;
    }
  });

  // prevent scroll
  document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,200));

  // boot
  resizeCanvas();
  state='menu';
  hideOverlay();
  applyLanguage();
  if (greenScreen) applyGreenScreen(true);
  applyBigLayout();
  drawMenu();
  requestAnimationFrame(loop);

  // PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
