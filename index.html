<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BRICK GAME 9999 IN 1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9c3b3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brick Game">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    --page: #6b6558;
    --shell: #c9c3b3;
    --shell-dark: #a89f8a;
    --brand: #5a5343;
    --screen-bg: #9db89a;
    --screen-bg2: #93af8f;
    --pixel-on: #2b3a2c;
    --pixel-off: #7f9d7d;
    --btn: #3c3c3c;
    --btn-dark: #232323;
    --dpad: clamp(132px, 40vw, 172px);
    --rbtn: clamp(60px, 17vw, 74px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--page);
    overflow: hidden;
    font-family: 'VT323', monospace;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    /* keep clear of notches / home indicator */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; border: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid #f4d35e; outline-offset: 2px; }
  .device {
    width: min(94vw, 440px);
    height: min(calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 12px), 860px);
    background: linear-gradient(145deg, var(--shell), var(--shell-dark));
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.4);
    padding: 14px 16px 10px;
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .brand {
    text-align: center; color: var(--brand); font-size: 16px; letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  .screen-wrap {
    background: #4b4a3f;
    border-radius: 8px;
    padding: 10px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .screen {
    background: linear-gradient(160deg, var(--screen-bg), var(--screen-bg2));
    border-radius: 4px;
    flex: 1;
    display: flex;
    padding: 8px;
    gap: 8px;
    min-height: 0;
    position: relative;
  }
  .board-area { flex: 1; display: flex; position: relative; justify-content: center; align-items: center; min-width: 0; }
  canvas#board { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
  .side {
    width: 76px;
    display: flex; flex-direction: column; gap: 6px;
    color: var(--pixel-on);
  }
  .panel {
    border: 2px solid var(--pixel-on);
    border-radius: 3px;
    padding: 4px;
    text-align: center;
  }
  .panel[hidden] { display: none; }
  .panel .lbl { font-size: 11px; letter-spacing: 1px; opacity: 0.8; }
  .panel .val { font-size: 20px; line-height: 1.1; }
  .panel .val.small { font-size: 15px; }
  canvas.mini { width: 100%; height: 48px; image-rendering: pixelated; display: block; }
  .overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
    background: rgba(157,184,154,0.94);
    background: color-mix(in srgb, var(--screen-bg) 94%, transparent);
    color: var(--pixel-on);
    font-size: 22px; text-align: center;
    letter-spacing: 1px;
    z-index: 10;
    padding: 8px;
  }
  .overlay.show { display: flex; }
  .overlay .small { font-size: 14px; opacity: 0.85; line-height: 1.3; }
  .overlay .tiny { font-size: 12px; opacity: 0.7; margin-top: 6px; white-space: pre-line; }
  .overlay .opts { font-size: 18px; line-height: 1.5; margin-top: 6px; text-align: left; }
  .overlay .opts div { padding: 0 6px; }
  .overlay .opts .sel { background: var(--pixel-on); color: var(--screen-bg); }
  .toast {
    position: absolute; left: 8px; right: 8px; top: 8px; z-index: 20;
    background: var(--pixel-on); color: var(--screen-bg);
    font-size: 17px; text-align: center; padding: 4px 6px; border-radius: 3px;
    opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .controls {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px 2px;
  }
  .dpad {
    position: relative;
    width: var(--dpad); height: var(--dpad);
  }
  .dbtn {
    position: absolute;
    width: calc(var(--dpad) / 3); height: calc(var(--dpad) / 3);
    background: linear-gradient(160deg, var(--btn), var(--btn-dark));
    border-radius: 6px;
    box-shadow: 0 3px 0 #111, inset 0 1px 1px rgba(255,255,255,0.15);
    color: #ccc; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--dpad) / 7.5);
    padding: 0;
  }
  .dbtn:active, .dbtn.active-press { box-shadow: 0 1px 0 #111; transform: translateY(2px); background: linear-gradient(160deg, #565656, #2a2a2a); }
  .d-left  { left: 0; top: calc(var(--dpad) / 3); border-radius: 8px 2px 2px 8px; }
  .d-right { right: 0; top: calc(var(--dpad) / 3); border-radius: 2px 8px 8px 2px; }
  .d-up    { left: calc(var(--dpad) / 3); top: 0; border-radius: 8px 8px 2px 2px; }
  .d-down  { left: calc(var(--dpad) / 3); bottom: 0; border-radius: 2px 2px 8px 8px; }
  .d-center{ position: absolute; left: calc(var(--dpad) / 3); top: calc(var(--dpad) / 3);
             width: calc(var(--dpad) / 3); height: calc(var(--dpad) / 3); background: var(--shell-dark); }

  /* ===== BIG 3-BUTTON MODE: large ↓ ◀ ▶ (no up) ===== */
  .controls.big-mode .dpad { width: calc(var(--dpad) * 1.3); height: calc(var(--dpad) * 0.95); }
  .controls.big-mode .d-up,
  .controls.big-mode .d-center { display: none !important; }
  .controls.big-mode .d-left,
  .controls.big-mode .d-right {
    top: 0; width: calc(var(--dpad) * 0.44); height: calc(var(--dpad) * 0.6);
    border-radius: 12px; font-size: calc(var(--dpad) / 6);
  }
  .controls.big-mode .d-down {
    left: calc(var(--dpad) * 0.43); bottom: 0; top: auto;
    width: calc(var(--dpad) * 0.44); height: calc(var(--dpad) * 0.44);
    border-radius: 12px; font-size: calc(var(--dpad) / 6.5);
  }
  .controls.big-mode .abtns { gap: 8px; }

  .abtns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .round {
    width: var(--rbtn); height: var(--rbtn); border-radius: 50%;
    background: linear-gradient(160deg, #7a2b2b, #4a1616);
    box-shadow: 0 4px 0 #2a0d0d, inset 0 1px 1px rgba(255,255,255,0.25);
    color: #f0d9d9; font-size: 15px; display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.1; padding: 0;
  }
  .round.blue {
    background: linear-gradient(160deg, #2b4a7a, #16294a);
    box-shadow: 0 4px 0 #0d1f2a, inset 0 1px 1px rgba(255,255,255,0.25);
    color: #d9e4f0;
  }
  .round:active, .round.active-press { box-shadow: 0 1px 0 #2a0d0d; transform: translateY(3px); }

  .bottom-row {
    display: flex; justify-content: center; gap: 10px; padding: 2px 0; flex-wrap: wrap;
  }
  .pill {
    background: linear-gradient(160deg, #555, #2c2c2c);
    color: #ccc; border-radius: 12px; padding: 8px 12px;
    font-size: 13px; letter-spacing: 1px;
    box-shadow: 0 3px 0 #111;
    min-height: 34px;
  }
  .pill:active { box-shadow: 0 1px 0 #111; transform: translateY(2px); }

  /* ===== Landscape phones: controls either side of the screen ===== */
  @media (orientation: landscape) and (max-height: 560px) {
    :root { --dpad: clamp(120px, 34vh, 160px); --rbtn: clamp(56px, 17vh, 70px); }
    .device {
      width: min(98vw, 900px);
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 8px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: 1fr auto;
      grid-template-areas: "dpad screen abtns" "dpad pills abtns";
      padding: 8px 14px;
      column-gap: 18px; row-gap: 6px;
    }
    .brand { display: none; }
    .screen-wrap { grid-area: screen; width: calc((100dvh - 80px) * 0.5 + 120px); padding: 6px; }
    .bottom-row { grid-area: pills; }
    .controls { display: contents; }
    .dpad { grid-area: dpad; align-self: center; justify-self: center; }
    .abtns { grid-area: abtns; align-self: center; justify-self: center; }
    .pill { padding: 5px 10px; min-height: 28px; font-size: 12px; }
  }
</style>
</head>
<body>
<main class="device">
  <div class="brand" id="brand">BRICK GAME &middot; 9999 IN 1</div>
  <div class="screen-wrap">
    <div class="screen">
      <div class="board-area"><canvas id="board" role="img" aria-label="Game screen"></canvas></div>
      <div class="side">
        <div class="panel">
          <div class="lbl" id="sideLabel1">NEXT</div>
          <canvas id="next" class="mini" width="60" height="48"></canvas>

        </div>

        </div>

  <div class="bottom-row">
    <button type="button" class="pill" id="btnStart">START/PAUSE</button>
    <button type="button" class="pill" id="btnSound">SOUND</button>

  <div class="controls">
    <div class="dpad">
      <div class="d-center"></div>

      <button type="button" class="dbtn d-right" id="btnRight" aria-label="Right">▶</button>
      <button type="button" class="dbtn d-down" id="btnDown" aria-label="Down">▼</button>
    </div>
    <div class="abtns">
      <button type="button" class="round" id="btnA" aria-label="A">A<br>ROT</button>
      <button type="button" class="round blue" id="btnB" aria-label="B">B<br>DROP</button>
    </div>
  </div>
</main>

<script>
(function(){
  // ========== STORAGE ==========
  // localStorage can throw (private mode, blocked storage): never let that break the game
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
    getJSON(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } },
    setJSON(k, v){ store.set(k, JSON.stringify(v)); }
  };

  // ========== AUDIO & SETTINGS ==========
  let soundOn    = store.get('bg_sound', '1') !== '0';
  let bigMode    = store.get('bg_big', '0') === '1';    // 3 big buttons ↓◀▶, default OFF
  let ghostOn    = store.get('bg_ghost', '1') !== '0';  // brick-drop landing preview
  let holdRepeat = store.get('bg_hold', '1') !== '0';   // classic hold-to-repeat
  let swipeOn    = store.get('bg_swipe', '1') !== '0';  // touch gestures on the screen
  let vibrateOn  = store.get('bg_vibrate', '1') !== '0';
  let theme      = store.get('bg_theme', store.get('bg_green', '0') === '1' ? 'green' : 'classic');
  let lang       = store.get('bg_lang', 'en');          // 'en' | 'el'
  const AC = window.AudioContext || window.webkitAudioContext;
  const audioCtx = AC ? new AC() : null;
  // Browsers start audio suspended until a user gesture; resume on any touch/click/key
  function unlockAudio(){ if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  ['touchstart','pointerdown','keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, {capture:true, passive:true}));

  // ===== i18n =====
  const I18N = {

      cars: 'CARS',

      fuel: 'FUEL',
      holdLbl: 'HOLD',
      daily: 'DAILY', statsItem: 'STATS', awardsItem: 'AWARDS',
      statsTitle: 'STATS', awardsTitle: 'AWARDS', anyBack: 'A/B = back',
      newRecord: 'NEW RECORD!', initialsHint: '▲▼ letter  ◀▶ move\nA = OK',
      bShare: 'B = share', copied: 'COPIED!', top5: 'TOP 5', fixedSet: '(fixed)',
      dailyDesc: 'Same for all today', todayIs: 'Today:',
      b_again: 'AGAIN', b_share: 'SHARE',
      linesLbl: 'LINES',
      set: 'SET',
      on: 'ON ',
      off: 'OFF',
      startPause: 'START/PAUSE',
      soundBtn: 'SOUND',
      muteBtn: 'MUTE',
      reset: 'RESET',
      // button captions
      b_rot: 'ROT', b_drop: 'DROP', b_fire: 'FIRE', b_go: 'GO', b_jump: 'JUMP',
      b_stop: 'STOP', b_ok: 'OK', b_back: 'BACK', b_swap: 'SWAP', b_turbo: 'TURBO', b_none: '·',
      // themes
      th_classic: 'CLASSIC', th_green: 'GREEN', th_grey: 'GREY', th_amber: 'AMBER', th_blue: 'BLUE',
    },
    el: {
      brand: 'BRICK GAME · 9999 ΣΕ 1',
      selectGame: 'ΕΠΙΛΟΓΗ ΠΑΙΧΝ.',
      startOk: 'START = OK',

      restart: 'ΞΑΝΑ',
      quit: 'ΕΞΟΔΟΣ',
      pauseHint: 'A = OK  START = συνέχεια',
      gameOver: 'ΤΕΛΟΣ',
      crash: 'ΣΥΝΤΡΙΒΗ!',
      score: 'ΣΚΟΡ',
      pressReset: 'START = ξανά\nRESET = μενού',
      mode: 'MODE',
      hi: 'HI',
      next: 'ΕΠΟΜ',
      live: 'ΖΩΕΣ',

      holdLbl: 'ΚΡΑΤ',
      daily: 'ΗΜΕΡΗΣΙΟ', statsItem: 'ΣΤΑΤΙΣΤ.', awardsItem: 'ΒΡΑΒΕΙΑ',
      statsTitle: 'ΣΤΑΤΙΣΤΙΚΑ', awardsTitle: 'ΒΡΑΒΕΙΑ', anyBack: 'A/B = πίσω',
      newRecord: 'ΝΕΟ ΡΕΚΟΡ!', initialsHint: '▲▼ γράμμα  ◀▶ θέση\nA = OK',
      bShare: 'B = κοινοποίηση', copied: 'ΑΝΤΙΓΡΑΦΗΚΕ!', top5: 'TOP 5', fixedSet: '(σταθερό)',
      dailyDesc: 'Ίδιο για όλους', todayIs: 'Σήμερα:',
      b_again: 'ΞΑΝΑ', b_share: 'ΜΟΙΡΑΣΕ',
      linesLbl: 'ΓΡΑΜ',
      set: 'SET',
      on: 'ΝΑΙ',
      off: 'ΟΧΙ',
      startPause: 'START/ΠΑΥΣΗ',
      soundBtn: 'ΗΧΟΣ',
      muteBtn: 'ΣΙΩΠΗ',
      reset: 'RESET',
      b_rot: 'ΠΕΡ', b_drop: 'ΡΙΞΕ', b_fire: 'ΒΟΛΗ', b_go: 'ΠΑΜΕ', b_jump: 'ΑΛΜΑ',
      b_stop: 'ΣΤΟΠ', b_ok: 'OK', b_back: 'ΠΙΣΩ', b_swap: 'ΑΛΛΑΓΗ', b_turbo: 'ΤΟΥΡΜΠΟ', b_none: '·',
      th_classic: 'ΚΛΑΣΙΚΟ', th_green: 'ΠΡΑΣΙΝΟ', th_grey: 'ΓΚΡΙ', th_amber: 'ΚΕΧΡΙΜΠ', th_blue: 'ΜΠΛΕ',
    }
  };
  function t(key){ return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }

  function applyBigLayout(){
    // Big L/R buttons only while actually playing a game
    controlsEl.classList.toggle('big-mode', !!(bigMode && state === 'play'));
  }

  function applyLanguage(){
    document.documentElement.lang = lang;
    document.getElementById('brand').textContent = t('brand');
    document.getElementById('btnStart').textContent = t('startPause');
    document.getElementById('btnSound').textContent = soundOn ? t('soundBtn') : t('muteBtn');
    document.getElementById('btnSettings').textContent = t('set');
    document.getElementById('btnReset').textContent = t('reset');
    document.getElementById('scoreLabel').textContent = t('score');
    document.getElementById('levelLabel').textContent = t('level').slice(0, 7);
    btnLabelKey = '';
    redrawScreen();
  }

  function beep(freq, dur, type='square', vol=0.08){
    if (!soundOn || !audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }
  function buzz(pattern){
    if (vibrateOn && navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} }
  }
  const BUZZ = { die: [80,40,120], line: 30, level: [20,30,20], hit: 12, eat: 10 };
  function sfx(name){
    if (BUZZ[name]) buzz(BUZZ[name]);
    if (!soundOn) return;
    switch(name){
      case 'move': beep(220, 0.04); break;
      case 'rotate': beep(330, 0.06); break;
      case 'drop': beep(110, 0.08); break;
      case 'lock': beep(180, 0.1); break;
      case 'line': beep(440, 0.12); setTimeout(()=>beep(550,0.12),80); setTimeout(()=>beep(660,0.15),160); break;
      case 'score': beep(520, 0.08); break;
      case 'die': beep(150, 0.2, 'sawtooth'); setTimeout(()=>beep(100,0.3,'sawtooth'),150); break;
      case 'level': beep(400,0.1); setTimeout(()=>beep(500,0.1),100); setTimeout(()=>beep(600,0.15),200); break;
      case 'select': beep(300, 0.05); break;
      case 'start': beep(350,0.08); setTimeout(()=>beep(450,0.1),90); break;
      case 'eat': beep(600, 0.07); break;

  function resizeCanvas(){
    // Size the board in device pixels so the LCD stays crisp on high-DPI phones
    const wrap = boardCanvas.parentElement;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const size = Math.floor(Math.min(w / COLS, h / ROWS) * dpr);
    cellSize = Math.max(8, size);
    boardCanvas.width = cellSize * COLS;
    boardCanvas.height = cellSize * ROWS;
    boardCanvas.style.width = (boardCanvas.width / dpr) + 'px';
    boardCanvas.style.height = (boardCanvas.height / dpr) + 'px';
    redrawScreen();
  }

  function clearBoard(bgAlpha=1){
    bctx.clearRect(0,0,boardCanvas.width, boardCanvas.height);
    // faint LCD off-pixels
    bctx.globalAlpha = 0.32 * bgAlpha;
    bctx.fillStyle = pixelOff;
    const pad = Math.max(1, cellSize*0.08);
    for (let r=0;r<ROWS;r++){
      for (let c=0;c<COLS;c++){
        bctx.fillRect(c*cellSize+pad, r*cellSize+pad, cellSize-pad*2, cellSize-pad*2);
      }
    }
    bctx.globalAlpha = 1;
  }

  function drawCell(x, y, on=true, alpha=1){
    if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;
    const pad = Math.max(1, cellSize*0.08);
    bctx.globalAlpha = alpha;
    bctx.fillStyle = on ? pixelOn : 'transparent';
    bctx.fillRect(x*cellSize+pad, y*cellSize+pad, cellSize-pad*2, cellSize-pad*2);
    bctx.globalAlpha = 1;
  }

  function drawRect(x, y, w, h, on=true){
    for (let dy=0; dy<h; dy++)
      for (let dx=0; dx<w; dx++)
        drawCell(x+dx, y+dy, on);
  }

  function drawGhostCell(x, y){
    if (y < 0) return;
    const pad = Math.max(1, cellSize*0.08);
    bctx.save();
    bctx.strokeStyle = pixelOn;
    bctx.lineWidth = Math.max(1, cellSize*0.09);
    bctx.globalAlpha = 0.55;
    bctx.strokeRect(x*cellSize+pad+bctx.lineWidth/2, y*cellSize+pad+bctx.lineWidth/2,
                    cellSize-pad*2-bctx.lineWidth, cellSize-pad*2-bctx.lineWidth);
    bctx.restore();
  }

    bctx.font = `${Math.floor(cellSize*size)}px VT323, monospace`;
    bctx.textAlign = 'left';
    bctx.textBaseline = 'top';
    lines.forEach((ln, i) => {
      const y = cellSize*top + i*cellSize*step;
      if (i === sel) {
        bctx.fillStyle = pixelOn;
        bctx.fillRect(cellSize*0.15, y - 1, cellSize*9.7, cellSize*step*0.96);

      } else bctx.fillStyle = pixelOn;
      bctx.fillText(ln, cellSize*left, y);
    });
  }

    const h = rows.length, w = rows[0].length;
    const size = Math.floor(Math.min((canvas.width-4)/w, (canvas.height-4)/h));
    const offX = Math.floor((canvas.width - w*size)/2), offY = Math.floor((canvas.height - h*size)/2);
    ctx.fillStyle = pixelOn;
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '#') ctx.fillRect(offX+x*size+1, offY+y*size+1, size-2, size-2);
    }));
  }

  function seededRandom(seedStr){
    let h = 1779033703 ^ seedStr.length;
    for (let i = 0; i < seedStr.length; i++){ h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    let a = h >>> 0;
    return function(){   // mulberry32
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let r = Math.imul(a ^ (a >>> 15), 1 | a);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

    if (!gp) return;
    const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const cur = {
      left: btn(14) || ax < -0.5, right: btn(15) || ax > 0.5, up: btn(12) || ay < -0.5, down: btn(13) || ay > 0.5,
      a: btn(0) || btn(3), b: btn(1) || btn(2), start: btn(9), select: btn(8), hold: btn(4) || btn(5),
    };
    for (const d of ['left','right','up','down']){
      if (cur[d] && !padPrev[d]){ handleDir(d); padNext[d] = ts + 220; }
      else if (cur[d] && holdRepeat && ts >= padNext[d]){ handleDir(d); padNext[d] = ts + 55; }
    }
    if (cur.a && !padPrev.a) handleA();
    if (cur.b && !padPrev.b) handleB();
    if (cur.start && !padPrev.start) togglePause();
    if (cur.select && !padPrev.select) document.getElementById('btnSettings').dispatchEvent(new Event('pointerdown'));
    if (cur.hold && !padPrev.hold && state === 'play' && G && G.hold){ G.hold(); G.draw(); }
    Object.assign(padPrev, cur);
  }
